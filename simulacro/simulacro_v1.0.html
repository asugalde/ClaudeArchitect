<style>
  /* =====================================================================
     DESIGN TOKENS — Volt (ver plantillas/volt-style-guide.html)
     ===================================================================== */
  :root {
    --font-sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;

    --fs-display:2.5rem; --fs-h1:2rem; --fs-h2:1.5rem; --fs-h3:1.25rem; --fs-h4:1.0625rem;
    --fs-body:1rem; --fs-sm:.875rem; --fs-caption:.75rem; --fs-code:.8125rem;

    --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-extra:800;

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

    --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px; --r-pill:999px;

    --shadow-sm:0 1px 2px rgba(12,27,44,.06);
    --shadow-md:0 4px 12px rgba(12,27,44,.08);

    --ease:150ms cubic-bezier(.4,0,.2,1);

    --bg:#FCFDFF; --surface:#FFFFFF; --surface-2:#F1F5FA;
    --border:#E1E9F1; --border-strong:#7E93AB;
    --text:#0E1B2C; --text-muted:#45536C; --text-subtle:#8496A8;

    --accent:#0E82FF; --accent-hover:#0A6BDB; --accent-active:#0857B4;
    --accent-weak:#E2F1FF; --accent-contrast:#06121F;

    --success:#0E8546; --success-weak:#E2F6EA;
    --warning:#8F5D0B; --warning-weak:#FBEFD9;
    --danger:#CE4148;  --danger-weak:#FBE7E8;
    --info:#2E63FF;    --info-weak:#EAF0FF;

    /* Texto sobre fondo --accent: casi blanco en ambos temas (no --accent-contrast). */
    --on-accent:#F7FBFF;

    /* --accent-text: texto acentuado (enlaces, eyebrows). --accent queda para rellenos/bordes/barras. */
    --accent-text:#0857B4;
    /* --accent-btn: fondo de botones/CTAs de acento (button.primary, .navgrid .current). */
    --accent-btn:#0A6BDB; --accent-btn-hover:#0857B4;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg:#06101C; --surface:#101927; --surface-2:#172230;
    --border:#213244; --border-strong:#55708C;
    --text:#E4EDF6; --text-muted:#B6C5D9; --text-subtle:#66788C;

    --accent:#3FA9FF; --accent-hover:#63BBFF; --accent-active:#2C93F0;
    --accent-weak:#0E2C48; --accent-contrast:#06101C;

    --accent-text:#3FA9FF;
    --accent-btn:#0A6BDB; --accent-btn-hover:#0857B4;

    --success:#37DA84; --success-weak:#123526;
    --warning:#F0A93C; --warning-weak:#33260F;
    --danger:#F0656C;  --danger-weak:#3A1A1C;
    --info:#6684FF;    --info-weak:#17223F;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 18px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  /* =====================================================================
     BASE
     ===================================================================== */
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font-sans); font-size:var(--fs-body); line-height:1.6;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    transition:background var(--ease),color var(--ease); }
  .wrap { max-width:960px; margin:0 auto; padding:40px 24px 90px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:var(--sp-5); margin-bottom:var(--sp-4); box-shadow:var(--shadow-sm); }
  h1 { font-size:var(--fs-h1); margin:0 0 var(--sp-1); font-weight:var(--fw-extra); letter-spacing:-.025em; color:var(--text); }
  .display { font-size:var(--fs-display); font-weight:var(--fw-extra); letter-spacing:-.03em; line-height:1.05; }
  h2 { font-size:var(--fs-h2); font-weight:var(--fw-bold); letter-spacing:-.02em; color:var(--text); margin:0 0 var(--sp-3); }
  .muted { color:var(--text-muted); font-size:var(--fs-sm); }
  button { font:inherit; font-size:var(--fs-caption); font-weight:var(--fw-semibold); border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text); border-radius:var(--r-md); padding:6px 12px; cursor:pointer;
    transition:background var(--ease),border-color var(--ease),color var(--ease); }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent-btn); border-color:var(--accent-btn); color:var(--on-accent); }
  button.primary:hover { background:var(--accent-btn-hover); border-color:var(--accent-btn-hover); color:var(--on-accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  :is(a,button,input,select):focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input { accent-color:var(--accent); }
  code { font-family:var(--font-mono); font-size:var(--fs-code); background:var(--surface-2); color:var(--text);
    border:1px solid var(--border); border-radius:var(--r-sm); padding:1px 6px; }
  /* CTA principal de portada (elección de modo): un punto mayor que el resto de botones de acción. */
  #m-estudio, #m-examen { font-size:var(--fs-sm); padding:8px 14px; }
  .opt { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--border); border-radius:var(--r-md);
    padding:10px 12px; margin:8px 0; cursor:pointer; transition:border-color var(--ease),background var(--ease); }
  .opt input { margin-top:4px; }
  .opt.sel { border-color:var(--accent); background:var(--accent-weak); }
  .opt.ok { border-color:var(--success); background:var(--success-weak); }
  .opt.ko { border-color:var(--danger); background:var(--danger-weak); }
  .creditos { margin:24px 0 0; padding-top:12px; border-top:1px solid var(--border); color:var(--text-muted); font-size:var(--fs-caption); }
  .rationale { font-size:var(--fs-sm); color:var(--text-muted); margin-top:6px; display:none; }
  .revealed .rationale { display:block; }
  .repasa { font-size:var(--fs-sm); color:var(--text-muted); margin:6px 0 10px; }
  .repasa a { color:var(--accent-text); font-weight:var(--fw-medium); }
  .scenario { background:var(--surface-2); border-left:3px solid var(--accent); padding:10px 14px;
    border-radius:0 var(--r-md) var(--r-md) 0; font-size:var(--fs-sm); margin-bottom:12px; }
  .q-topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .timer { font-variant-numeric:tabular-nums; font-weight:var(--fw-semibold); font-family:var(--font-mono); }
  .timer.low { color:var(--danger); }
  .navgrid { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .navgrid button { width:38px; height:32px; padding:0; font-size:var(--fs-caption); }
  .navgrid .answered { background:var(--success-weak); border-color:var(--success); }
  .navgrid .flagged { outline:2px solid var(--warning); }
  .navgrid .current { background:var(--accent-btn); border-color:var(--accent-btn); color:var(--on-accent); }
  @media (pointer:coarse) {
    button.primary, button#check, button#next, button#prev, button#nextq, button#flag, button#finish,
    .actions button, .toggle { min-height:44px; }
    .navgrid button { width:44px; height:44px; }
  }
  .pill { display:inline-block; font-size:var(--fs-caption); font-weight:var(--fw-medium); border:1px solid var(--border); background:var(--surface-2);
    border-radius:var(--r-pill); padding:1px 10px; margin-right:6px; color:var(--text-muted); }
  table { border-collapse:collapse; width:100%; font-size:var(--fs-sm); }
  th,td { border-bottom:1px solid var(--border); padding:10px 12px; text-align:left; }
  th { font-weight:var(--fw-semibold); font-size:var(--fs-caption); text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-muted); border-bottom:2px solid var(--border-strong); }
  tbody tr:hover { background:var(--surface-2); }
  .big { font-size:2rem; font-weight:var(--fw-bold); }
  .ok-t { color:var(--success); } .ko-t { color:var(--danger); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  /* =====================================================================
     CABECERA — topbar sticky + hero limpio (ver plantillas/volt-style-guide.html)
     ===================================================================== */
  header.topbar { position:sticky; top:0; z-index:30; display:flex; justify-content:space-between;
    align-items:center; gap:var(--sp-4); padding:14px 24px; margin:0; flex-wrap:nowrap;
    background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border); }
  header.topbar .brand { display:flex; align-items:center; gap:10px; font-weight:var(--fw-bold);
    letter-spacing:-.01em; color:var(--text); min-width:0; overflow:hidden; }
  header.topbar .brand .dot { width:20px; height:20px; border-radius:6px; background:var(--accent); flex:0 0 auto; }
  header.topbar .brand .brand-full { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .brand-sigla { font-family:var(--font-mono); font-size:var(--fs-caption); font-weight:var(--fw-medium); color:var(--text-muted); flex:0 0 auto; }
  header.topbar .controls { display:flex; gap:8px; align-items:center; flex:0 0 auto; }
  @media (max-width:420px) { header.topbar .brand .brand-full { display:none; } }
  .toggle { cursor:pointer; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
    padding:8px 13px; border-radius:var(--r-md); font-size:var(--fs-sm); font-weight:var(--fw-semibold);
    font-family:inherit; line-height:1; transition:border-color var(--ease),color var(--ease); }
  .toggle:hover { border-color:var(--accent); color:var(--accent); }
  @media print { header.topbar .controls { display:none !important; } }

  .hero { padding:var(--sp-7) 0 var(--sp-2); }
  .eyebrow { font-family:var(--font-mono); font-size:var(--fs-caption); color:var(--accent-text);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:var(--sp-2); }
  @media (max-width:700px) { .hero h1 { font-size:var(--fs-h2); } header.topbar { padding:12px 16px; } .wrap { padding-left:16px; padding-right:16px; } }
  @media print { header.topbar { position:static; background:none; backdrop-filter:none; border-bottom:2px solid var(--accent); }
    .hero { padding:var(--sp-4) 0 var(--sp-2); } }
</style>
</head>

<script>

const DATA = {"config":{"titulo":"Simulacro de examen CCAR-F","version":"1.0","bloque":"simulacro","modo_defecto":"examen","solo_examen":true,"duracion_examen_min":120,"generado_desde_corpus":"bloque-{0..5}-*.md v1.0 (simulacro agregado desde recursos/quiz/bloque-{0..5}/preguntas_v1.0.json)","fecha":"2026-08-07"},"preguntas":[{"id":"b2-q16","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.6","escenario":"A CI pipeline step invokes `claude` to summarize a build log, but the job hangs indefinitely and eventually times out, with no output ever produced.","enunciado":"What is the most likely cause and fix?","opciones":[{"id":"A","texto":"Claude Code was run in its default interactive mode, which can wait for input; adding `-p`/`--print` runs it non-interactively so it completes without hanging.","correcta":true,"justificacion":"-p/--print is documented specifically to prevent the pipeline from stalling on interactive input; running without it is the documented cause of exactly this kind of hang."},{"id":"B","texto":"The `--bare` flag was missing, and without it Claude always waits for hooks to be manually approved.","correcta":false,"justificacion":"--bare skips auto-discovery of hooks, skills, plugins, MCP servers, auto memory, and CLAUDE.md for faster, more consistent startup; the documented cause of indefinite hangs is missing -p/--print, not --bare."},{"id":"C","texto":"`--output-format json` must be set for any pipeline invocation to complete.","correcta":false,"justificacion":"The output format flag controls the shape of the returned result; it has no bearing on whether the process hangs waiting for interactive input."},{"id":"D","texto":"The stdin input exceeded 10 MB, causing the process to hang instead of erroring.","correcta":false,"justificacion":"Exceeding the documented 10 MB stdin limit causes Claude to terminate with an error and non-zero exit status, not an indefinite hang."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-2-6","fuentes":["https://code.claude.com/docs/en/headless"]},{"id":"b2-q07","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.3","escenario":"A team's test files (`*.test.ts`) are spread across dozens of directories throughout the codebase with no single common parent folder. They want a consistent testing convention (naming pattern, mocking rules) to apply to every one of them without maintaining a `CLAUDE.md` in every directory that happens to contain a test file.","enunciado":"What is the correct mechanism for this requirement?","opciones":[{"id":"A","texto":"A path-scoped rule in `.claude/rules/` with `paths: [\"**/*.test.ts\"]`, loaded on-demand whenever Claude reads a matching file regardless of its location.","correcta":true,"justificacion":"This is exactly the documented advantage of path-scoped rules over per-directory CLAUDE.md: applying a convention by file type across the whole tree without replicating CLAUDE.md in every folder."},{"id":"B","texto":"A subdirectory `CLAUDE.md` placed at the repository root, since subdirectory files load recursively for every folder below it.","correcta":false,"justificacion":"Subdirectory CLAUDE.md only loads on-demand for the specific subdirectory when Claude reads files there; it does not act as a type-based rule applied broadly across unrelated directories."},{"id":"C","texto":"`claudeMdExcludes` configured to include all test directories.","correcta":false,"justificacion":"claudeMdExcludes is used in monorepos to exclude other teams' CLAUDE.md files from loading; it does not apply or scope any conventions."},{"id":"D","texto":"A single `.claude/rules/testing.md` with no `paths:` frontmatter, so it always loads at session start.","correcta":false,"justificacion":"Loading unconditionally at session start wastes context on files where the rule is irrelevant; on-demand, path-matched loading requires the `paths:` field, which this option omits."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-2-3","fuentes":["https://code.claude.com/docs/en/memory"]},{"id":"b4-q02","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.1","escenario":"Your production agent enforces maxBudgetUsd: 2.00 to control cost. In one session, cumulative spend — including delegated subagent calls — crosses that ceiling mid-task. The application's result handler only branches on subtype === \"success\" vs. everything else, logging every non-success ResultMessage as \"hit turn limit, resume from session_id\" regardless of which limit was actually exceeded.","enunciado":"What is incorrect about this handling, and what is the correct fix?","opciones":[{"id":"A","texto":"The handler mislabels every non-success termination as a turn-limit event; it should branch explicitly on ResultMessage.subtype, since error_max_budget_usd (a cost ceiling that includes subagent spend) is a distinct condition from error_max_turns and warrants a different operator response.","correcta":true,"justificacion":"The SDK documents distinct subtype values (success, error_max_turns, error_max_budget_usd, error_during_execution, error_max_structured_output_retries); collapsing them into a single generic branch loses the information needed to react correctly."},{"id":"B","texto":"maxTurns should be removed entirely, since maxBudgetUsd already guards against runaway cost.","correcta":false,"justificacion":"maxTurns and maxBudgetUsd are independent safety nets covering different concerns (turn count vs. estimated spend); removing one doesn't address the handler's real bug, which is not distinguishing subtypes."},{"id":"C","texto":"Subagent spend should be excluded from the parent's budget so only the top-level agent's turns count against maxBudgetUsd.","correcta":false,"justificacion":"Subagent spend counts against the same total budget as the parent by design; excluding it would contradict the documented behavior, not fix the handler."},{"id":"D","texto":"Increase maxTurns so that subagent tool calls fit comfortably under the turn cap.","correcta":false,"justificacion":"The scenario's limit that was exceeded is the cost ceiling (maxBudgetUsd), not the turn cap; raising maxTurns doesn't address a budget-related termination or the handler's failure to distinguish subtypes."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-4-1","fuentes":["https://code.claude.com/docs/en/agent-sdk/agent-loop"]},{"id":"b0-q09","bloque":0,"dominio":null,"taskStatement":"0.3","escenario":"Claude's response contains two tool_use blocks in the same turn — check_inventory and get_shipping_cost. The check_inventory call fails with a database timeout. To \"save a round trip,\" the client sends a tool_result only for get_shipping_cost, silently skipping check_inventory, and separately sends a generic message of \"failed\" whenever an error does get reported.","enunciado":"Select TWO changes required to bring this handling in line with the documented tool_use/tool_result pattern.","opciones":[{"id":"A","texto":"Return a tool_result for every tool_use block emitted in that turn, including check_inventory, since each tool_use requires its own corresponding tool_result.","correcta":true,"justificacion":"When Claude emits multiple tool_use blocks in parallel, the client must execute and return a tool_result for each one; omitting one breaks the required one-to-one correspondence and can break the loop."},{"id":"B","texto":"Mark the check_inventory tool_result with is_error: true and a descriptive message (e.g., \"Database timeout after 30s, inventory service unavailable\") instead of a generic string.","correcta":true,"justificacion":"Errors must be flagged with is_error and carry an instructive message so Claude can decide intelligently whether to retry or escalate; a generic message like \"failed\" gives it nothing to act on."},{"id":"C","texto":"Buffer the whole batch and wait until check_inventory eventually succeeds before sending any tool_result.","correcta":false,"justificacion":"This isn't the documented pattern; a failed execution should be reported as an error result, not withheld indefinitely, and get_shipping_cost's already-available result shouldn't be blocked on it."},{"id":"D","texto":"Replace the failed call's tool_result with an empty content array to mark it as non-fatal.","correcta":false,"justificacion":"An empty content array without is_error is reserved for a valid, genuinely empty (non-error) result, not for masking a real execution failure like a database timeout."},{"id":"E","texto":"Increase max_tokens so Claude can produce a longer error message on the next turn.","correcta":false,"justificacion":"max_tokens bounds the output token budget; it has no relationship to whether the client correctly reports tool execution errors back to Claude."}],"seleccionar":2,"dificultad":"dificil","refSeccion":"#ts-0-3","fuentes":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/how-tool-use-works","https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls"]},{"id":"b1-q02","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.1","escenario":"A security review prompt defines severity levels critical/high/medium/low with a one-sentence textual description each. Despite these definitions, the same type of finding is classified as \"high\" in one run and \"medium\" in another.","enunciado":"What change is most likely to fix this severity classification inconsistency?","opciones":[{"id":"A","texto":"Add a concrete code example for each severity level so classification anchors to actual cases, not abstract labels.","correcta":true,"justificacion":"Concrete code examples anchored to each severity level are what produce consistent classification across runs; textual labels alone leave the boundary between levels open to arbitrary interpretation."},{"id":"B","texto":"Replace the four textual levels with a numeric score from 1 to 10.","correcta":false,"justificacion":"A numeric scale without concrete anchoring examples is just as susceptible to inconsistent application as textual labels; it doesn't resolve the underlying ambiguity."},{"id":"C","texto":"Add 10+ generic few-shot examples covering easy, unambiguous cases.","correcta":false,"justificacion":"Piling on generic examples without targeting the actual severity boundary inflates context length without proportionally improving consistency, the documented anti-pattern of over-adding examples."},{"id":"D","texto":"Increase max_tokens so severity descriptions can be longer.","correcta":false,"justificacion":"max_tokens only bounds the output token budget; it has no bearing on how consistently the model applies severity criteria across runs."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-1-1","fuentes":["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"]},{"id":"b5-q06","bloque":5,"dominio":"Context Management & Reliability","taskStatement":"5.2","escenario":"While designing escalation logic, a team debates several signals to use for deciding whether a case needs human review.","enunciado":"Select TWO signals that are explicitly documented as unreliable proxies for actual case complexity.","opciones":[{"id":"A","texto":"Sentiment analysis detecting how frustrated the customer sounds.","correcta":true,"justificacion":"Sentiment doesn't correlate reliably with complexity: a frustrated customer with a trivial issue doesn't need escalation, and a calm customer with a complex case might."},{"id":"B","texto":"The model's own self-reported confidence score for the case.","correcta":true,"justificacion":"Self-reported confidence is unreliable because the model can be incorrectly confident precisely on the difficult cases where it fails most."},{"id":"C","texto":"Explicit escalation criteria with few-shot examples embedded in the system prompt.","correcta":false,"justificacion":"This is the documented correct pattern for escalation, not an unreliable proxy signal."},{"id":"D","texto":"The customer explicitly requesting a human agent.","correcta":false,"justificacion":"This is one of the three legitimate, explicit escalation triggers, not an inferred proxy for complexity."},{"id":"E","texto":"Detecting that the current policy doesn't address the customer's specific request.","correcta":false,"justificacion":"This is also a legitimate, explicit trigger (a policy gap), not an indirect complexity proxy."}],"seleccionar":2,"dificultad":"media","refSeccion":"#ts-5-2","fuentes":["https://www.anthropic.com/engineering/built-multi-agent-research-system"]},{"id":"b5-q02","bloque":5,"dominio":"Context Management & Reliability","taskStatement":"5.1","escenario":"An order-lookup tool returns a JSON payload with 40+ fields (shipping carrier metadata, internal warehouse codes, audit timestamps, etc.), of which only order_id, status, amount, and ship_date matter for the current task. Across a ten-turn session, these payloads accumulate in context, and the team notices token usage climbing without any corresponding improvement in answer quality.","enunciado":"What is the correct fix for this pattern of context accumulation?","opciones":[{"id":"A","texto":"Trim each tool result to only the fields relevant to the task before it accumulates in context, rather than keeping the full 40+ field payload turn after turn.","correcta":true,"justificacion":"Trimming verbose tool outputs to the relevant fields before they accumulate directly addresses irrelevant fields consuming token budget without adding value."},{"id":"B","texto":"Progressively summarize the accumulated tool outputs into shorter, vaguer descriptions each time a new one arrives.","correcta":false,"justificacion":"Vague progressive summarization is the same anti-pattern that destroys precise transactional values; it trades bulk for lost precision on the few fields that actually matter."},{"id":"C","texto":"Increase the model's context window so all fields comfortably fit without any trimming.","correcta":false,"justificacion":"Fitting isn't the problem; irrelevant fields still consume token budget turn after turn and add no value regardless of how much headroom the window has."},{"id":"D","texto":"Insert a dedicated classifier model that scores each of the 40+ fields for relevance before every tool call.","correcta":false,"justificacion":"Over-engineered; a simple deterministic filter to the known relevant fields achieves the same result without training or maintaining a separate model."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-5-1","fuentes":["https://platform.claude.com/docs/en/build-with-claude/context-windows"]},{"id":"b5-q08","bloque":5,"dominio":"Context Management & Reliability","taskStatement":"5.3","escenario":"A coordinator receives 'no data' both when a subagent's search timed out and when a subagent's search executed successfully but simply found zero matching records. In several cases it wrongly retries a query that had already legitimately returned zero results, and in others it wrongly accepts a timeout as a confirmed 'no results found.'","enunciado":"What is the correct architectural fix for this confusion?","opciones":[{"id":"A","texto":"Have subagents explicitly distinguish access failures (marked as errors, with a retryable flag) from valid empty results (a successful response with empty content) in their structured output.","correcta":true,"justificacion":"Access failures and valid empty results require opposite responses; distinguishing them explicitly in the structured output is what lets the coordinator react correctly to each."},{"id":"B","texto":"Increase every tool's timeout duration so access failures become rare enough to ignore.","correcta":false,"justificacion":"Reduces frequency but not the underlying ambiguity in the report; a timeout can still occur and still be indistinguishable from a valid empty result without an explicit contract."},{"id":"C","texto":"Have the subagent report 'likely no results' whenever it isn't fully certain what happened.","correcta":false,"justificacion":"Introduces vague, fabricated uncertainty language instead of a structured, reliable signal; it still doesn't tell the coordinator whether a retry is warranted."},{"id":"D","texto":"Have the coordinator retry any 'no data' response several times before accepting it, just to be safe.","correcta":false,"justificacion":"Wastes calls on legitimate empty results and doesn't fix the reporting contract that caused the ambiguity in the first place."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-5-3","fuentes":["https://www.anthropic.com/engineering/built-multi-agent-research-system"]},{"id":"b5-q18","bloque":5,"dominio":"Context Management & Reliability","taskStatement":"5.6","escenario":"A final multi-source report renders every finding as uniform prose, and none of the structured outputs feeding into it include a publication or collection date field. Analysts complain that (1) they can't tell whether an apparent contradiction between two data points is a real conflict or just a difference in when each was collected, and (2) financial figures are hard to compare at a glance.","enunciado":"Select TWO changes that directly address both complaints.","opciones":[{"id":"A","texto":"Require every structured finding to include a publication or collection date field, so temporal differences aren't mistaken for real contradictions.","correcta":true,"justificacion":"Missing publication dates is exactly what causes legitimate temporal differences to be misread as contradictions; requiring dates in every structured output fixes that."},{"id":"B","texto":"Render different content types with formats suited to them — for example, tables for financial data and prose for narrative findings — instead of forcing everything into uniform prose.","correcta":true,"justificacion":"Matching rendering to content type (tables for financial data, prose for narrative) is the documented fix for uniform prose losing the conventions that make comparison easy."},{"id":"C","texto":"Assign a dedicated agent to rewrite all findings into a single consistent narrative voice.","correcta":false,"justificacion":"Uniform prose is the documented problem for content types like financial data, not the fix."},{"id":"D","texto":"Drop any data point whose collection date cannot be verified.","correcta":false,"justificacion":"An overly aggressive fix that discards potentially valid data instead of simply requiring and preserving date metadata going forward."},{"id":"E","texto":"Have the coordinator unilaterally decide which of two conflicting values to keep before synthesis, without annotating the other.","correcta":false,"justificacion":"Contradicts the documented pattern of annotating both conflicting values with attribution rather than arbitrarily resolving to one."}],"seleccionar":2,"dificultad":"dificil","refSeccion":"#ts-5-6","fuentes":["https://www.anthropic.com/engineering/built-multi-agent-research-system"]},{"id":"b1-q07","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.3","escenario":"A document pipeline has separate extraction tools for invoices, receipts, and contracts, each with its own JSON schema. The incoming document's type is unknown ahead of time, but some extraction tool must always run.","enunciado":"Which tool_choice setting best matches this requirement?","opciones":[{"id":"A","texto":"{\"type\": \"any\"}","correcta":true,"justificacion":"\"any\" forces Claude to call some extraction tool while still letting it choose which schema fits the unknown document type, exactly the documented use case for an uncertain document type with multiple candidate schemas."},{"id":"B","texto":"\"auto\"","correcta":false,"justificacion":"\"auto\" allows Claude to respond with plain text instead of calling any extraction tool, which doesn't satisfy the requirement that some tool always runs."},{"id":"C","texto":"{\"type\": \"tool\", \"name\": \"extract_invoice\"}","correcta":false,"justificacion":"Forcing a single named tool removes the flexibility needed when the document type — and therefore the correct schema — is unknown in advance."},{"id":"D","texto":"\"none\"","correcta":false,"justificacion":"\"none\" prevents any tool call entirely, the opposite of the requirement that some extraction tool always runs."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-1-3","fuentes":["https://platform.claude.com/docs/en/build-with-claude/structured-outputs"]},{"id":"b1-q14","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.5","escenario":"A pipeline must guarantee that extraction results are available within an SLA of 30 hours from document arrival, using the Message Batches API, which can take up to 24 hours to complete.","enunciado":"Per the documented calculation pattern, how frequently should batches be submitted to satisfy this SLA?","opciones":[{"id":"A","texto":"Every 4 hours","correcta":true,"justificacion":"Per the documented pattern for calculating submission frequency against an SLA, guaranteeing results within 30 hours against a batch processing window of up to 24 hours requires submitting batches every 4 hours."},{"id":"B","texto":"Every 24 hours","correcta":false,"justificacion":"Submitting only every 24 hours — the maximum processing window itself — leaves no buffer to consistently guarantee the 30-hour SLA."},{"id":"C","texto":"Every 30 hours","correcta":false,"justificacion":"Submitting at the SLA boundary itself provides no margin and does not match the documented calculation for sustaining a 30-hour SLA."},{"id":"D","texto":"Only once, at the start of the SLA window","correcta":false,"justificacion":"A single submission doesn't account for documents arriving continuously throughout the SLA period."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-1-5","fuentes":["https://platform.claude.com/docs/en/build-with-claude/batch-processing"]},{"id":"b3-q12","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.3","escenario":"In a multi-agent pipeline, a synthesis agent that only summarizes already-gathered findings has been given the full tool catalog, including web_search and fetch_url. Logs show it repeatedly attempting new web searches mid-summary instead of relying on the data already collected by upstream agents.","enunciado":"What is the most effective fix for this behavior, per the documented role-based scoping pattern?","opciones":[{"id":"A","texto":"Restrict the synthesis agent's tool list to only what its role needs (e.g., verify_fact, summarize), removing web_search and fetch_url entirely.","correcta":true,"justificacion":"Role-based tool scoping assigns each agent only its specialization's catalog; giving a synthesis agent search tools outside its role is exactly the documented cause of this kind of misuse, and removing them is the fix."},{"id":"B","texto":"Add a system prompt instruction telling the synthesis agent never to call web_search.","correcta":false,"justificacion":"This relies on probabilistic prompt compliance for a decision that can be enforced structurally by simply not granting the tool at all."},{"id":"C","texto":"Set tool_choice to \"none\" for the synthesis agent so it can never call any tool.","correcta":false,"justificacion":"This is too restrictive; it would also block verify_fact, a legitimate cross-tool need documented for the synthesis role, not just the unwanted web_search."},{"id":"D","texto":"Keep the full catalog but add strict: true to web_search and fetch_url so their inputs are validated more carefully.","correcta":false,"justificacion":"strict governs input conformance once a tool is called; it does not address whether the agent should have access to the tool at all, which is the actual scoping problem."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-3-3","fuentes":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools","https://code.claude.com/docs/en/mcp-quickstart"]},{"id":"b1-q08","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.3","escenario":"An extract_invoice tool has strict: true, and 100% of production responses are valid JSON conforming to the schema. Despite this, a systemic issue persists: the sum of line_items frequently doesn't equal the reported total field.","enunciado":"What best explains this and what should be done about it?","opciones":[{"id":"A","texto":"strict mode validates structure and types via grammar-constrained sampling, not semantic correctness; add an explicit semantic validation step (e.g., comparing calculated vs. stated total) outside the schema guarantee.","correcta":true,"justificacion":"strict mode has no mechanism to check that field values are mutually consistent; that check requires an explicit semantic validation step outside the schema guarantee, since strict only eliminates syntax errors."},{"id":"B","texto":"strict mode is misconfigured; add minimum/maximum constraints on the amount fields.","correcta":false,"justificacion":"minimum/maximum numeric constraints are not supported in strict mode, and even if they were, they wouldn't verify that two independently reported numbers are mutually consistent."},{"id":"C","texto":"Increase max_tokens so the model has more room to compute the correct sum.","correcta":false,"justificacion":"max_tokens bounds the output token budget; it has no effect on whether the model computes or reports mutually consistent totals."},{"id":"D","texto":"Switch tool_choice from \"any\" to a forced tool name to guarantee correctness.","correcta":false,"justificacion":"tool_choice governs whether and which tool is called, not whether the values produced inside a valid call are semantically correct."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-1-3","fuentes":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use","https://platform.claude.com/docs/en/build-with-claude/structured-outputs"]},{"id":"b4-q07","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.3","escenario":"A team upgraded their Agent SDK from an older version to 2.1.63+. After the upgrade, their coordinator's calls to spawn subagents silently stop working; the coordinator's allowedTools list still contains only \"Task\", unchanged since before the upgrade.","enunciado":"What is the correct fix?","opciones":[{"id":"A","texto":"In SDK 2.1.63+ the subagent-spawning tool was renamed from \"Task\" to \"Agent\"; allowedTools must include \"Agent\" for the coordinator to invoke subagents (SDKs prior to 2.1.63 use \"Task\" instead — both names refer to the same tool depending on version).","correcta":true,"justificacion":"The Agent tool was renamed from \"Task\" in SDK version 2.1.63; allowedTools must reference the name matching the installed SDK version for subagent spawning to work."},{"id":"B","texto":"\"Task\" was deprecated with no replacement; subagents must now be spawned exclusively via AgentDefinition.initialPrompt.","correcta":false,"justificacion":"initialPrompt auto-sends a first user turn only when an agent runs as the primary agent of a thread; it is ignored when that agent is invoked as a subagent, and is not a subagent-spawning mechanism."},{"id":"C","texto":"allowedTools no longer governs the Agent tool since 2.1.63; it must instead be listed under mcpServers.","correcta":false,"justificacion":"The Agent tool is still gated by allowedTools like any other tool; mcpServers configures MCP server connections, an unrelated mechanism."},{"id":"D","texto":"The coordinator must set permissionMode instead of allowedTools to enable subagent spawning.","correcta":false,"justificacion":"permissionMode configures the permission mode for tool execution within an agent; it doesn't control whether the Agent/Task tool itself is available to be called."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-4-3","fuentes":["https://code.claude.com/docs/en/agent-sdk/subagents"]},{"id":"b3-q09","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.3","escenario":"A single research agent has access to 18 tools spanning web search, document analysis, fact verification, summarization, and file export, even though on a typical run it only ever needs 3-4 of them. Tool selection errors have increased since the catalog grew from 6 to 18.","enunciado":"What is the most effective fix for this reliability degradation?","opciones":[{"id":"A","texto":"Apply scoped tool access, splitting the catalog across specialized agents so each one only has the tools relevant to its role, with cross-tool access limited to specific high-frequency needs.","correcta":true,"justificacion":"Giving an agent far more tools than its role needs is documented as degrading selection reliability by increasing decision complexity; scoped tool access by role is the documented structural fix."},{"id":"B","texto":"Set tool_choice to \"any\" so the agent is forced to pick a tool instead of responding with plain text.","correcta":false,"justificacion":"Forcing a call doesn't reduce the decision surface among 18 candidate tools; it addresses a different requirement (always calling some tool), not selection accuracy."},{"id":"C","texto":"Add strict: true to every tool so malformed inputs are rejected.","correcta":false,"justificacion":"strict enforces schema conformance of whatever tool is eventually called; it does not address selection accuracy degraded by an oversized catalog."},{"id":"D","texto":"Write longer descriptions for each of the 18 tools to help the model differentiate them.","correcta":false,"justificacion":"The root cause here is catalog size and role mismatch, not description quality; scoping the catalog per agent is the documented, lower-effort structural fix."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-3-3","fuentes":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"]},{"id":"b4-q12","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.4","escenario":"An agent escalates a case to a human agent by pasting the raw conversation transcript with no summary, forcing the human to re-read the entire exchange to find the customer ID, root cause, and refund amount before acting.","enunciado":"What is the correct fix per the documented handoff pattern?","opciones":[{"id":"A","texto":"Compile a structured handoff summary (customer ID, root cause, amount, recommended action, plus relevant context) instead of forwarding raw prose, so the human agent has sufficient context without needing the full transcript.","correcta":true,"justificacion":"The documented handoff protocol is a structured summary with exactly these fields, designed so the human agent doesn't need access to the full transcript to act."},{"id":"B","texto":"Increase max_turns so the agent has more turns available to summarize on its own before escalating.","correcta":false,"justificacion":"max_turns bounds the loop's turn budget; it has no bearing on whether the escalation content is structured or raw prose."},{"id":"C","texto":"Add a hook that truncates the transcript to the last five messages before forwarding.","correcta":false,"justificacion":"Truncated raw prose still isn't a structured summary and may omit the very fields (customer ID, root cause, amount) the human needs; it doesn't guarantee the required information is present."},{"id":"D","texto":"Have the agent apologize more explicitly in the transcript before forwarding.","correcta":false,"justificacion":"This doesn't address the actual problem, which is the lack of structured, extractable information in the handoff content."}],"seleccionar":1,"dificultad":"dificil","refSeccion":"#ts-4-4","fuentes":["exam-guide-oficial-v1.0.txt (Task Statement 1.4)"]},{"id":"b4-q04","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.2","escenario":"A coordinator agent spawns three subagents to investigate a corporate merger. To \"save a round trip,\" one subagent is configured to forward its intermediate findings directly to a second subagent, without passing back through the coordinator first.","enunciado":"What is wrong with this design per the documented coordinator-subagent pattern?","opciones":[{"id":"A","texto":"The coordinator-subagent pattern is hub-and-spoke: all communication must flow through the coordinator; subagents communicating directly breaks the centralized routing, error handling, and observability the pattern relies on.","correcta":true,"justificacion":"Subagents never communicate directly with each other by design; routing everything through the coordinator is what keeps the system observable and gives it consistent error handling."},{"id":"B","texto":"There is no issue; direct subagent-to-subagent communication is more efficient and doesn't affect the pattern's guarantees.","correcta":false,"justificacion":"This contradicts the hub-and-spoke definition of the pattern, which requires all routing to pass through the coordinator regardless of perceived efficiency gains."},{"id":"C","texto":"The real problem is having only two subagents involved in the exchange instead of the documented range of 3–5 concurrent subagents.","correcta":false,"justificacion":"The 3–5 concurrent subagent range describes lead-agent spawning for investigation breadth; it has nothing to do with whether two already-spawned subagents may talk directly to each other."},{"id":"D","texto":"The fix is to insert a routing classifier between the two subagents to manage their direct exchange more reliably.","correcta":false,"justificacion":"Adding a classifier layer to manage an exchange that shouldn't exist in the first place is over-engineering; the documented fix is simply routing the exchange back through the coordinator."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-4-2","fuentes":["https://code.claude.com/docs/en/agent-sdk/subagents"]},{"id":"b2-q11","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.4","escenario":"A developer needs to add a single null-check condition to one function, with the exact fix already clear from the stack trace. Before making the change, they activate plan mode with `Shift+Tab` and spend several minutes describing the investigation approach before letting Claude touch any file.","enunciado":"How should this use of plan mode be evaluated?","opciones":[{"id":"A","texto":"It's unnecessary overhead — the change is simple and well-scoped enough to describe in one sentence, so direct execution would have been the appropriate choice.","correcta":true,"justificacion":"The documented guidance is to skip planning when the diff can be described in one sentence; systematically planning trivial single-file edits introduces overhead without adding value."},{"id":"B","texto":"It's correct, since any use of plan mode before an edit reduces the risk of incorrect changes, regardless of task size.","correcta":false,"justificacion":"Planning systematically even for trivial single-file edits is explicitly documented as an anti-pattern that slows down the workflow unnecessarily."},{"id":"C","texto":"It's incorrect because plan mode cannot be used for single-file changes at all.","correcta":false,"justificacion":"Plan mode isn't restricted to multi-file changes; it can apply to single-file edits when warranted, but the issue here is task simplicity, not a hard technical restriction."},{"id":"D","texto":"It's correct, because plan mode is required before any change involving a stack trace.","correcta":false,"justificacion":"No such requirement exists; a stack-trace-driven fix with an evident, well-scoped solution is precisely the documented example where direct execution is the appropriate choice."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-2-4","fuentes":["https://code.claude.com/docs/en/best-practices"]},{"id":"b1-q10","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.4","escenario":"An invoice extraction fails validation because the sum of item amounts ($1000) doesn't match the stated total ($1500). The retry prompt simply says \"The previous extraction was invalid, please try again.\" The retry reproduces the exact same error.","enunciado":"What is the most effective fix for this retry loop?","opciones":[{"id":"A","texto":"Rewrite the retry prompt to include the exact validation error (e.g., \"$1000 sum != $1500 stated total\"), the original document, and the failed extraction.","correcta":true,"justificacion":"Including the exact validation error, the original document, and the failed extraction gives the model actionable information to correct the specific problem; a generic message gives it nothing to act on and tends to reproduce the same error."},{"id":"B","texto":"Increase the retry count from 1 to 10 without changing the retry prompt content.","correcta":false,"justificacion":"Increasing retry attempts without changing what information is fed back doesn't fix the underlying problem — the model will keep repeating the same mistake with the same generic prompt."},{"id":"C","texto":"Switch tool_choice to \"any\" for the retry call.","correcta":false,"justificacion":"tool_choice governs whether/which tool is called, not the quality of feedback the model receives about why its previous extraction failed validation."},{"id":"D","texto":"Add strict: true to the tool definition to prevent invalid output on retry.","correcta":false,"justificacion":"strict: true guarantees structural conformance, not that the model receives the specific semantic error needed to correct a totals mismatch on retry."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-1-4","fuentes":[]},{"id":"b4-q06","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.2","escenario":"A coordinator delegates \"research this\" to three subagents with no further detail, hoping they'll divide the work themselves. Logs show significant overlap: two of the three subagents independently gather nearly identical sources.","enunciado":"What is the most effective fix for this duplication?","opciones":[{"id":"A","texto":"Give each subagent an explicit, partitioned research objective, output format, and tool guidance up front, dividing the query's scope by subtopic or source type before delegation rather than leaving it to each subagent to interpret independently.","correcta":true,"justificacion":"Vague delegation instructions are the documented root cause of duplicated work between subagents; explicit objectives, format, and boundaries are what let the coordinator partition scope correctly."},{"id":"B","texto":"Increase the number of subagents from three to five so more ground is covered overall.","correcta":false,"justificacion":"Adding more subagents without clearer delegation would likely increase overlap rather than fix it, since the root cause is vague instructions, not insufficient subagent count."},{"id":"C","texto":"Add a post-hoc deduplication step that removes repeated sources after synthesis.","correcta":false,"justificacion":"This treats a symptom after the fact instead of the root cause; the documented fix is clearer upfront delegation that prevents the duplication of effort in the first place."},{"id":"D","texto":"Restrict each subagent's tool access so that only one of them can use WebSearch.","correcta":false,"justificacion":"Removing capability from subagents doesn't clarify scope; it risks under-covering the topic instead of resolving the ambiguity that caused the overlap."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-4-2","fuentes":["https://code.claude.com/docs/en/agent-sdk/subagents"]},{"id":"b2-q01","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.1","escenario":"A new engineer joins the team and reports that Claude Code doesn't follow the 'always run `make lint` before committing' rule that the rest of the team relies on daily, even though a senior engineer insists they added that instruction to CLAUDE.md months ago.","enunciado":"The senior engineer confirms the instruction lives in `~/.claude/CLAUDE.md` on their own machine. What is the most likely explanation, and the correct fix?","opciones":[{"id":"A","texto":"The instruction was added at user level, which is personal and never shared via version control; moving it into the project's `./CLAUDE.md` makes it load for every team member.","correcta":true,"justificacion":"User-level CLAUDE.md is personal and not shared via version control, while project-level CLAUDE.md is shared with the team; an instruction meant for everyone must live at project level."},{"id":"B","texto":"Claude Code caches CLAUDE.md content across machines via the API, and the cache needs to be cleared for the new engineer.","correcta":false,"justificacion":"There is no cross-machine caching mechanism for CLAUDE.md; it is read from local files at session start, so no cache clearing step exists."},{"id":"C","texto":"The rule exceeded the 200-line guideline and was silently truncated only for the new engineer's sessions.","correcta":false,"justificacion":"Exceeding the line guideline dilutes adherence for everyone equally by adding noise, not something that selectively drops content for one specific team member."},{"id":"D","texto":"The instruction should be moved to `.claude/rules/` with a `paths:` filter matching `**/*` so it applies everywhere.","correcta":false,"justificacion":"This is unnecessary complexity for a universal, always-applicable convention; project-level CLAUDE.md already loads at session start for everyone without needing a path-scoped rule."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-2-1","fuentes":["https://code.claude.com/docs/en/memory"]},{"id":"b4-q17","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.7","escenario":"You have three previous sessions from earlier this week in the same project directory. You want to return specifically to the session where you were comparing pagination strategies, not the most recent one, which was about an unrelated logging bug.","enunciado":"Which mechanism is correct for returning to that specific session?","opciones":[{"id":"A","texto":"resume with that session's specific session ID (or --resume <session-name> if it was given a name), since continue would only pick up the most recent session, and this isn't it.","correcta":true,"justificacion":"resume is documented specifically for returning to a session ID that is not the most recent, exactly this situation; continue always finds the most recent session in the directory instead."},{"id":"B","texto":"continue, since it will find the correct session automatically among the three.","correcta":false,"justificacion":"continue locates only the most recent session in the current directory, which in this scenario is the unrelated logging-bug session, not the pagination one."},{"id":"C","texto":"forkSession, since it will create a new branch of the pagination session while leaving the current one untouched.","correcta":false,"justificacion":"forkSession is documented for branching an existing session to explore a divergent approach, not for retrieving and returning directly to a specific prior session by identity; resume is the documented mechanism for that."},{"id":"D","texto":"Start a brand-new session and paste in a summary of the pagination discussion so far.","correcta":false,"justificacion":"This discards the actual persisted session state unnecessarily when resume can retrieve that exact session directly by ID."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-4-7","fuentes":["https://code.claude.com/docs/en/agent-sdk/sessions"]},{"id":"b3-q16","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.5","escenario":"An engineer needs to find every file in the repository whose name ends in .test.tsx, so they run a Grep search with the pattern \".test.tsx\" across the codebase. The search returns zero matches even though dozens of matching files exist.","enunciado":"What is the correct fix for this search?","opciones":[{"id":"A","texto":"Use Glob with the pattern **/*.test.tsx, since finding files by name pattern is Glob's purpose, while Grep searches file contents (lines), not file names.","correcta":true,"justificacion":"Grep matches patterns within file content, while Glob matches file paths by name pattern; a file-name search like this one is exactly what Glob's ** recursive matching is documented for."},{"id":"B","texto":"Escape the pattern for ripgrep syntax, e.g., \\.test\\.tsx, and rerun the same Grep search.","correcta":false,"justificacion":"Escaping helps when searching for literal special characters within file content, but it doesn't change the fact that Grep searches content, not names; a file's own name doesn't appear as text inside its content."},{"id":"C","texto":"Add the glob parameter to the Grep call to restrict the search to .tsx files, keeping the same content pattern.","correcta":false,"justificacion":"This configures which files Grep searches within, but the task is to find files by name, which is Glob's role, not a content search restricted by extension."},{"id":"D","texto":"Set multiline: true on the Grep call so it can match across the whole file.","correcta":false,"justificacion":"multiline affects whether a content pattern can span multiple lines within a file; it has no effect on matching file names."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-3-5","fuentes":["https://code.claude.com/docs/en/tools-reference"]},{"id":"b2-q10","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.4","escenario":"A team is migrating from one HTTP client library to another across roughly 60 files in the codebase, and two viable integration approaches exist with different infrastructure implications (one requires a new connection-pooling service, the other doesn't).","enunciado":"What is the appropriate way to start this task?","opciones":[{"id":"A","texto":"Start in plan mode to explore the codebase and evaluate both approaches before committing to changes, given the scale and the divergent infrastructure implications.","correcta":true,"justificacion":"This matches the documented signals for plan mode: a large-scale, multi-file change (well past the 45+ file threshold) with multiple valid approaches carrying different infrastructure requirements."},{"id":"B","texto":"Skip planning and start editing files directly, correcting course if the wrong approach becomes apparent partway through.","correcta":false,"justificacion":"This is the documented anti-pattern for architecturally significant, multi-file changes with several viable approaches: skipping exploration risks costly rework if the wrong approach was chosen first."},{"id":"C","texto":"Use `tool_choice: \"any\"` to force Claude to call a migration tool on every file.","correcta":false,"justificacion":"tool_choice is a Messages API tool-selection parameter unrelated to Claude Code's plan mode vs. direct execution decision for a codebase migration."},{"id":"D","texto":"Write a detailed `CLAUDE.md` describing both approaches and let Claude pick one automatically without further review.","correcta":false,"justificacion":"CLAUDE.md is non-binding contextual guidance; it doesn't provide the explicit exploration-then-approval step that plan mode offers for a decision of this scale and infrastructure impact."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-2-4","fuentes":["https://code.claude.com/docs/en/permission-modes","https://code.claude.com/docs/en/best-practices"]},{"id":"b5-q12","bloque":5,"dominio":"Context Management & Reliability","taskStatement":"5.4","escenario":"A team is deciding how to combine compaction and subagent delegation while exploring a large codebase.","enunciado":"Which statement correctly distinguishes the two mechanisms?","opciones":[{"id":"A","texto":"Compaction automatically summarizes the accumulated conversation once a token threshold is crossed (a platform-level mechanism), while subagent delegation isolates verbose exploration output so it never enters the main agent's context at all; they are complementary, not interchangeable.","correcta":true,"justificacion":"Compaction and delegation are two distinct, complementary mechanisms — automatic summarization at a threshold versus isolation of verbose output — and neither substitutes for the other."},{"id":"B","texto":"They are functionally identical — both simply delete old context to free up tokens.","correcta":false,"justificacion":"Compaction summarizes rather than deletes, and delegation isolates rather than either summarizing or deleting; neither description matches 'simply deleting.'"},{"id":"C","texto":"Compaction requires scratchpad files to function, while delegation needs no persistence mechanism at all.","correcta":false,"justificacion":"Compaction operates independently of scratchpad files; the two are separate, complementary tools, not dependent on each other."},{"id":"D","texto":"Subagent delegation is triggered automatically once a token threshold is reached, exactly like compaction.","correcta":false,"justificacion":"Delegation is a deliberate decision by the coordinating agent to spin off a subagent for a specific question, not an automatic threshold-triggered mechanism like compaction."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-5-4","fuentes":["https://platform.claude.com/docs/en/build-with-claude/compaction"]},{"id":"b2-q17","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.6","escenario":"A team switches their CI job to `claude --bare -p \"Run the test suite\"` for faster, more consistent startup. Immediately after the switch, every invocation fails with an authentication error, even though the exact same command without `--bare` worked fine on the same runner.","enunciado":"What is the most likely cause and fix?","opciones":[{"id":"A","texto":"`--bare` mode does not read OAuth credentials or the system keychain; setting `ANTHROPIC_API_KEY` in the environment restores authentication.","correcta":true,"justificacion":"--bare is documented to skip reading OAuth credentials and the system keychain, so authenticating to the Anthropic API in that mode requires explicitly setting ANTHROPIC_API_KEY."},{"id":"B","texto":"`--bare` disables the Anthropic API entirely and only supports Bedrock/GCP deployments.","correcta":false,"justificacion":"No such restriction is documented; --bare's effect is skipping auto-discovery of hooks/skills/plugins/MCP/CLAUDE.md/auto memory, and it still works with the Anthropic API given an explicit key."},{"id":"C","texto":"`--bare` requires `--output-format json` to be set simultaneously or authentication is skipped.","correcta":false,"justificacion":"No documented dependency exists between --bare and --output-format regarding authentication; they are independent flags."},{"id":"D","texto":"`--bare` only works with `--json-schema` provided, since it assumes structured output mode.","correcta":false,"justificacion":"There is no documented requirement tying --bare to --json-schema; --bare's effect is on auto-discovery and credential reading, unrelated to output schema enforcement."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-2-6","fuentes":["https://code.claude.com/docs/en/headless"]},{"id":"b3-q14","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.4","escenario":"A project's .mcp.json file, checked into the team's git repository, hardcodes the value of GITHUB_TOKEN directly as a literal string in the env block, rather than referencing an environment variable.","enunciado":"What is the correct fix for this configuration?","opciones":[{"id":"A","texto":"Replace the literal token with environment variable expansion syntax, e.g., \"env\": {\"GITHUB_TOKEN\": \"${GITHUB_TOKEN}\"}, so the credential is resolved at connection time and never committed to version control.","correcta":true,"justificacion":"The ${VAR} expansion syntax in .mcp.json is the documented mechanism for managing credentials without committing them, resolved at connection time rather than stored as literal values."},{"id":"B","texto":"Move the entire mcpServers block into ~/.claude.json instead, since user-level configuration is not checked into git.","correcta":false,"justificacion":"Moving the server to user scope loses the team-wide sharing that .mcp.json provides for a standard integration; it sidesteps the credential problem rather than fixing it and changes the intended sharing scope."},{"id":"C","texto":"Add a \"type\": \"http\" field, since only HTTP servers support secure credential handling.","correcta":false,"justificacion":"The type field determines transport (http vs stdio), not credential security; it does nothing to address a hardcoded secret in the env block."},{"id":"D","texto":"Rename the server to avoid using any of the reserved names like workspace or computer-use.","correcta":false,"justificacion":"Reserved-name restrictions are a distinct, unrelated validity rule for server names; renaming does nothing about a hardcoded credential."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-3-4","fuentes":["https://code.claude.com/docs/en/mcp"]},{"id":"b1-q16","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.6","escenario":"The same Claude instance that generated a code fix is then asked, in the same session, to review its own output for bugs before merging.","enunciado":"Is this the recommended pattern for reviewing generated code?","opciones":[{"id":"A","texto":"No — a same-instance self-review retains the reasoning used to generate the code and is less likely to question its own decisions; an independent reviewer instance without that context is more effective at catching subtle issues.","correcta":true,"justificacion":"A same-instance self-review retains the reasoning used to generate the code and is documented as less likely to question its own prior decisions; an independent reviewer instance is documented as more effective at catching subtle issues."},{"id":"B","texto":"Yes, as long as extended thinking is enabled for the review step.","correcta":false,"justificacion":"Extended thinking within the same instance is explicitly documented as not matching the effectiveness of an independent reviewer instance, since the model still retains its generation-time reasoning."},{"id":"C","texto":"Yes, because the same instance has full context of what it just wrote.","correcta":false,"justificacion":"Retaining full context of what it just wrote is exactly why the same instance is less likely to challenge its own decisions, not a reason self-review is adequate."},{"id":"D","texto":"No — the fix is to add tool_choice: \"any\" to force additional scrutiny.","correcta":false,"justificacion":"tool_choice governs whether/which tool is called; it has no bearing on whether the reviewing instance has independent context from the generator."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-1-6","fuentes":[]},{"id":"b4-q08","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.3","escenario":"A synthesis subagent is invoked with a prompt that says only \"synthesize the research findings into a report.\" It has no access to the coordinator's earlier conversation turns, so it produces a generic report with no actual findings. The engineer assumed the subagent would automatically see the coordinator's conversation history.","enunciado":"What is the correct fix?","opciones":[{"id":"A","texto":"Explicitly inject the full findings from the earlier subagents into the synthesis subagent's prompt text (e.g., the search results and document analysis output), since subagents have isolated context and never automatically inherit the coordinator's conversation history or prior tool results.","correcta":true,"justificacion":"Subagents operate with isolated context by design; assuming automatic inheritance of the coordinator's history is a documented anti-pattern, and the correct pattern is explicit injection of prior findings into the prompt."},{"id":"B","texto":"Set AgentDefinition.memory to 'project' so the subagent reads the coordinator's conversation history from shared project memory.","correcta":false,"justificacion":"memory configures the subagent's own memory scope; it is not the documented mechanism for passing a coordinator's conversation history into a subagent invocation."},{"id":"C","texto":"Set forkSession: true on the synthesis subagent invocation so it forks the coordinator's session and inherits the history.","correcta":false,"justificacion":"forkSession creates an independent branch of a session's conversation history for exploring divergent approaches; it is not the documented mechanism for passing context into an Agent tool invocation."},{"id":"D","texto":"List \"conversationHistory\" in the subagent's skills array so it precedes the invocation with the coordinator's context.","correcta":false,"justificacion":"skills preloads named skill content into a subagent's context; there is no documented \"conversationHistory\" skill or equivalent feature for inheriting the parent's conversation."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-4-3","fuentes":["https://code.claude.com/docs/en/agent-sdk/subagents"]},{"id":"b2-q05","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.2","escenario":"A compliance team builds a `security-audit` skill meant to run only when a developer explicitly types `/security-audit`, never automatically, and that must only ever read code (never edit files or run shell commands) while it executes.","enunciado":"Select TWO frontmatter settings that together enforce both requirements.","opciones":[{"id":"A","texto":"`disable-model-invocation: true`, so Claude never auto-invokes the skill and it isn't preloaded into subagents.","correcta":true,"justificacion":"This flag prevents Claude from loading the skill automatically, reserving it for manual, disable-model-invocation-style trigger workflows, which matches the 'only via explicit /security-audit' requirement."},{"id":"B","texto":"`allowed-tools: \"Read,Grep\"`, so only read-only tools are pre-approved during the invocation, excluding Write, Edit, and Bash.","correcta":true,"justificacion":"allowed-tools preapproves a specific, restricted tool set for the invocation; limiting it to Read and Grep satisfies the read-only-execution requirement."},{"id":"C","texto":"Omit the `description` field entirely, since a skill without a description is never auto-invocable.","correcta":false,"justificacion":"Omitting description does not disable auto-invocation; Claude falls back to the first paragraph of the skill's markdown body as a lower-quality description, so it remains a candidate for auto-invocation."},{"id":"D","texto":"`context: fork`, so the skill's execution is isolated from the main conversation.","correcta":false,"justificacion":"context: fork isolates verbose or exploratory output from contaminating the main conversation; it does not restrict tool access or control automatic invocation, the two stated requirements here."},{"id":"E","texto":"Rename the skill's `name` field to something Claude is unlikely to guess.","correcta":false,"justificacion":"The name field only changes the label displayed for the skill; it has no effect on whether the skill is auto-invoked or on which tools it can access."}],"seleccionar":2,"dificultad":"media","refSeccion":"#ts-2-2","fuentes":["https://code.claude.com/docs/en/skills"]},{"id":"b0-q10","bloque":0,"dominio":null,"taskStatement":"0.4","escenario":"An agent uses the web_search server tool. After several internal search iterations, a response comes back with stop_reason: \"pause_turn\", and the client immediately renders response.content to the end user as the final answer.","enunciado":"What is wrong with this handling of pause_turn?","opciones":[{"id":"A","texto":"pause_turn is not a terminal state — the internal server-tool iteration limit was reached but Claude hasn't finished; the client must resend the assistant message as-is so Claude can continue where it paused.","correcta":true,"justificacion":"pause_turn signals that server tools hit their internal iteration cap (default 10) without the model finishing; treating it as final serves an incomplete answer, exactly the documented anti-pattern of confusing pause_turn with end_turn."},{"id":"B","texto":"This is expected; pause_turn and end_turn carry the same semantics for rendering purposes.","correcta":false,"justificacion":"The two are explicitly different: end_turn is a terminal state ready to use, while pause_turn requires the client to resend and continue the loop."},{"id":"C","texto":"The client should increase max_tokens on the next request to force an end_turn result.","correcta":false,"justificacion":"max_tokens governs the output token budget of a single response; it does not change server tool iteration limits or convert pause_turn into end_turn."},{"id":"D","texto":"The client should discard the paused assistant message and start a fresh user turn instead.","correcta":false,"justificacion":"Discarding the paused work loses the server tool progress already made; the documented pattern is to resend the assistant message, including the already-received server_tool_use results, unchanged."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-0-4","fuentes":["https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons"]},{"id":"b2-q09","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.3","escenario":"A platform team maintains rules at both `~/.claude/rules/` (shared across every project on the machine) and `.claude/rules/` inside a specific project, with some overlapping guidance between the two, plus several `paths:` entries using brace expansion like `src/**/*.{ts,tsx,js,jsx}` across many rule files.","enunciado":"Select TWO statements that correctly describe documented behavior in this setup.","opciones":[{"id":"A","texto":"User-level rules load before project-level rules, so on a conflict the project-level rule takes precedence.","correcta":true,"justificacion":"User-level rules under ~/.claude/rules/ load before project rules, giving project rules higher precedence when they conflict."},{"id":"B","texto":"Patterns using brace expansion count against a shared budget of 1,000 expanded patterns and 4 MiB per rule, while patterns without braces don't count against that budget.","correcta":true,"justificacion":"The 1,000-pattern/4 MiB budget applies specifically to brace-expanded patterns; patterns without braces are excluded from that shared budget."},{"id":"C","texto":"Project-level rules load before user-level rules, so the user-level rule always wins on conflict.","correcta":false,"justificacion":"This reverses the documented load order: user-level rules load first, and project-level rules take precedence, not the other way around."},{"id":"D","texto":"Once a rule matches and loads, its guidance is enforced like a `PreToolUse` hook, blocking any conflicting action.","correcta":false,"justificacion":"Rules are non-binding contextual guidance, not enforcement; only a PreToolUse hook provides a guaranteed hard block on an action."},{"id":"E","texto":"Every glob pattern, whether or not it uses brace expansion, counts against the 1,000-pattern/4 MiB budget.","correcta":false,"justificacion":"Only patterns that use brace expansion count against that budget; patterns without braces are explicitly excluded from it."}],"seleccionar":2,"dificultad":"dificil","refSeccion":"#ts-2-3","fuentes":["https://code.claude.com/docs/en/memory"]},{"id":"b5-q01","bloque":5,"dominio":"Context Management & Reliability","taskStatement":"5.1","escenario":"A customer support agent resends the full conversation history on every request, as required by the stateless Messages API. After 15 turns, a mid-conversation summary compresses the details of an order dispute into 'the customer has a shipping issue,' and the agent can no longer state the order ID, refund amount, or the 5-business-day commitment it made earlier.","enunciado":"What is the most effective fix for this loss of transactional detail?","opciones":[{"id":"A","texto":"Extract the order ID, amount, dates, and the stated customer expectation into a persistent 'case facts' block included in every prompt, kept outside the resumable history, so no later summary can dilute those values.","correcta":true,"justificacion":"A persistent case-facts block extracted apart from the resumable history is precisely the pattern that prevents progressive summarization from ever touching the critical transactional values."},{"id":"B","texto":"Continue resending the full history unchanged and trust the model to re-derive the details from earlier turns each time.","correcta":false,"justificacion":"This is what already happened; relying on recall from a long, resummarized history is exactly what let progressive summarization dilute the values in the first place."},{"id":"C","texto":"Stop resending the full conversation history and send only the latest user message to reduce token usage and force the model to focus on what's current.","correcta":false,"justificacion":"The stateless API requires the client to resend the full desired history for coherence; sending only the latest message breaks that requirement instead of fixing the summarization issue."},{"id":"D","texto":"Load the entire customer order database into context at session start so any order detail is always available if needed.","correcta":false,"justificacion":"Loading data 'just in case' consumes tokens and accelerates context rot; the correct approach is just-in-time exploration plus persisting the few facts about this specific case, not preloading everything."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-5-1","fuentes":["https://platform.claude.com/docs/en/build-with-claude/context-windows"]},{"id":"b3-q06","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.2","escenario":"A payment tool call fails twice in the same session: once because the payment gateway timed out after 30 seconds, and once because the requested refund amount exceeds the customer's single-transaction limit. The current implementation returns isRetryable: false for both cases and no errorCategory field.","enunciado":"Select TWO corrections needed to bring these two error responses in line with documented practice.","opciones":[{"id":"A","texto":"Mark the gateway timeout as errorCategory: \"transient\" with isRetryable: true, since a temporary infrastructure failure can reasonably succeed on retry.","correcta":true,"justificacion":"Transient errors such as timeouts are exactly the category documented as reasonably retryable, unlike validation, business, or permission failures."},{"id":"B","texto":"Mark the transaction-limit violation as errorCategory: \"business\" with isRetryable: false, and include a user-facing explanation of the limit so the agent can communicate it rather than retry.","correcta":true,"justificacion":"Business rule violations never change outcome on retry; the documented pattern is isRetryable: false plus a client-facing explanation so the agent can inform the user instead of retrying in vain."},{"id":"C","texto":"Mark both errors as errorCategory: \"validation\" with isRetryable: false, since neither call ultimately succeeded.","correcta":false,"justificacion":"This mislabels the timeout, which is a transient infrastructure issue, not a validation problem, and conflates two distinct documented categories."},{"id":"D","texto":"Mark both errors as isRetryable: true, since retrying can never make the situation worse.","
