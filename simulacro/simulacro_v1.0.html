correcta":false,"justificacion":"Retrying a business rule violation like an over-limit refund cannot change the outcome and wastes the agent's effort; treating all errors as retryable is a documented anti-pattern."},{"id":"E","texto":"Omit errorCategory for the transaction-limit case and rely on the human-readable text alone.","correcta":false,"justificacion":"Omitting the category forces the agent to parse free text to decide whether to retry, defeating the purpose of structured error metadata."}],"seleccionar":2,"dificultad":"media","refSeccion":"#ts-3-2","fuentes":["https://modelcontextprotocol.io/docs/develop/build-server"]},{"id":"b3-q04","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.1","escenario":"A tool's response returns every field the underlying database exposes, including internal fields like row_uuid and 256px_thumbnail_url, for every call. Separately, the team wrote the tool's description once during initial development and has not touched it since, despite six months of production transcripts showing repeated selection errors.","enunciado":"What is the most effective combination of fixes for this tool?","opciones":[{"id":"A","texto":"Replace opaque identifiers with semantic field names (e.g., name, image_url) and apply pagination or truncation by default to reduce irrelevant payload, and treat the tool's description as part of an iterative cycle: revise it and the input_schema from the accumulated production transcripts, then validate against a held-out set of tasks not used during iteration.","correcta":true,"justificacion":"Semantic field names and default pagination/truncation are the documented output design rules that reduce token consumption and irrelevant payload, while revising the description and schema from real transcripts and validating against a held-out set is the documented iterative process for correcting a stale description; together they address both root causes described in the scenario."},{"id":"B","texto":"Add strict: true so the schema forces smaller output payloads.","correcta":false,"justificacion":"strict governs conformance of the tool's input JSON to its schema; it has no documented effect on the shape or size of the tool's output payload."},{"id":"C","texto":"Set tool_choice to \"any\" so the tool's output is trimmed automatically by the API.","correcta":false,"justificacion":"tool_choice controls whether and which tool gets called; it has no relationship to output payload shape or size."},{"id":"D","texto":"Rename the tool with a namespace prefix to reduce token consumption.","correcta":false,"justificacion":"Namespacing helps differentiate tools across multiple coexisting services; it does not reduce token consumption caused by a bloated output payload."}],"seleccionar":1,"dificultad":"dificil","refSeccion":"#ts-3-1","fuentes":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools","https://www.anthropic.com/engineering/writing-tools-for-agents"]},{"id":"b3-q11","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.3","escenario":"A data-extraction workflow must guarantee two things every turn: (1) the model always calls one of its extraction tools rather than replying with text, and (2) whatever input it produces conforms exactly to the tool's schema. A teammate also insists on adding a prompt instruction asking the model to briefly explain its reasoning in a sentence before the tool call, expecting that sentence to still appear once the guarantees are in place.","enunciado":"Select TWO statements that correctly describe how to achieve this, per the documented tool_choice and strict behavior.","opciones":[{"id":"A","texto":"Setting tool_choice to {\"type\": \"any\"} together with strict: true on the tools provides the compound guarantee: a tool is always called, and its input conforms exactly to the schema.","correcta":true,"justificacion":"\"any\" guarantees a tool is called, and strict guarantees schema conformance of the input; combined they give exactly the documented compound guarantee this workflow needs."},{"id":"B","texto":"The explanatory sentence will not appear before the tool_use block, because \"any\" (like a forced tool) triggers an automatic assistant-message prefill that prevents any preceding text regardless of prompt wording.","correcta":true,"justificacion":"Forced tool_choice values (\"any\" or a named tool) trigger an automatic prefill of the assistant message, which is documented to suppress any preceding text even when the prompt explicitly requests it."},{"id":"C","texto":"Keeping tool_choice at \"auto\" with strict: true achieves both guarantees while also preserving the explanatory sentence.","correcta":false,"justificacion":"\"auto\" does not guarantee that a tool is called at all, since the model can still respond with plain text; it fails the first required guarantee even though it would preserve the preceding sentence."},{"id":"D","texto":"The explanatory sentence will still appear, since strict only affects the input schema and has no relationship with tool_choice's prefill behavior.","correcta":false,"justificacion":"strict indeed doesn't cause the prefill, but the prefill still comes from \"any\" itself; this option incorrectly concludes the sentence will appear when it will not."},{"id":"E","texto":"A forced named tool, e.g., {\"type\": \"tool\", \"name\": \"extract_data\"}, should be used instead of \"any\" so the reasoning sentence can appear before the call.","correcta":false,"justificacion":"A forced named tool triggers the same automatic prefill behavior as \"any\"; it does not allow preceding text either."}],"seleccionar":2,"dificultad":"dificil","refSeccion":"#ts-3-3","fuentes":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"]},{"id":"b1-q13","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.5","escenario":"A nightly job regenerates unit tests for the entire codebase. It is not user-facing and can tolerate waiting several hours for results before the next business day.","enunciado":"Which API should be used for this workload, and why?","opciones":[{"id":"A","texto":"The Message Batches API, since the workload is non-blocking and latency-tolerant, offering a 50% cost saving in exchange for a processing window of up to 24 hours with no latency SLA.","correcta":true,"justificacion":"This workload matches exactly the documented profile for the Message Batches API: non-blocking, latency-tolerant, and eligible for the 50% cost saving in exchange for a window of up to 24 hours."},{"id":"B","texto":"The synchronous Messages API, for guaranteed low latency.","correcta":false,"justificacion":"The synchronous API is the right choice for blocking, real-time-feedback workloads; using it here would forgo the batch API's cost saving for a workload that doesn't need low latency."},{"id":"C","texto":"The Message Batches API with stream: true enabled for progress updates.","correcta":false,"justificacion":"stream: true is explicitly not supported on batch requests; requesting it would be invalid for this workload."},{"id":"D","texto":"The synchronous API with max_tokens: 0 to reduce cost.","correcta":false,"justificacion":"max_tokens: 0 is explicitly not supported on batch requests, and using the synchronous API here would forgo the batch API's cost advantage for a workload that tolerates waiting."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-1-5","fuentes":["https://platform.claude.com/docs/en/build-with-claude/batch-processing"]},{"id":"b1-q05","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.2","escenario":"A team added 12 few-shot examples covering simple, uncontroversial cases to a tool-selection prompt. Genuinely ambiguous cases — where two overlapping tools could plausibly apply — are still handled inconsistently.","enunciado":"What change is most likely to fix the ambiguous-case handling?","opciones":[{"id":"A","texto":"Replace the generic examples with 2-4 examples specifically targeting the ambiguous decision points, including explicit reasoning for why one tool was chosen over the other.","correcta":true,"justificacion":"Few, well-targeted examples covering the actual ambiguous decision points, including explicit reasoning, generalize judgment to new ambiguous cases better than broad, uncontroversial examples."},{"id":"B","texto":"Add 10 more generic examples to increase overall coverage.","correcta":false,"justificacion":"More generic examples covering easy, uncontroversial cases don't teach the model how to handle the genuinely ambiguous cases; example count isn't the lever — targeting is."},{"id":"C","texto":"Remove all examples and rely purely on detailed textual instructions.","correcta":false,"justificacion":"Removing examples abandons the technique most effective for consistency and judgment generalization; detailed instructions alone were already shown to be insufficient."},{"id":"D","texto":"Increase the example count to 20 to be safe.","correcta":false,"justificacion":"Simply increasing example count further, without targeting the actual ambiguous cases, is the documented anti-pattern of adding examples without proportional gain in clarity."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-1-2","fuentes":["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"]},{"id":"b4-q10","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.4","escenario":"Production logs for your refund workflow show that in 12% of cases the agent calls process_refund without having first called get_customer to verify identity, occasionally causing refunds against unverified accounts. The current system prompt already states \"always verify the customer before issuing a refund.\"","enunciado":"What is the most effective fix for this reliability issue?","opciones":[{"id":"A","texto":"Add a programmatic prerequisite gate that blocks process_refund until get_customer has returned a verified customer ID, since prompt-based instructions alone have a documented non-zero failure rate for exactly this kind of critical ordering requirement.","correcta":true,"justificacion":"This is a financially consequential step where the documented 12% skip rate shows prompt-only guidance is insufficient; programmatic enforcement provides the deterministic guarantee prompting cannot."},{"id":"B","texto":"Rewrite the system prompt sentence more emphatically (\"ALWAYS verify before refunding, no exceptions\").","correcta":false,"justificacion":"This still relies on probabilistic prompt compliance for a non-negotiable ordering requirement — the exact anti-pattern documented to fail in a meaningful fraction of cases regardless of phrasing."},{"id":"C","texto":"Add several few-shot examples demonstrating the correct call order.","correcta":false,"justificacion":"Few-shot examples still leave compliance probabilistic; they don't provide the deterministic guarantee needed when the protected step has financial consequences."},{"id":"D","texto":"Force tool_choice to \"any\" so the agent must call some tool every turn.","correcta":false,"justificacion":"\"any\" only guarantees that some tool is called, not which one or in what order; it does nothing to prevent process_refund from being called before get_customer."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-4-decision","fuentes":["exam-guide-oficial-v1.0.txt (Task Statement 1.4)"]},{"id":"b4-q03","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.1","escenario":"In a single AssistantMessage, Claude requests four tool calls in the same turn: two Read calls, one Grep call, and one Edit call targeting the same file. An engineer assumes the SDK executes all four concurrently to save latency, and separately assumes that because two different tool categories (read vs. write) were exercised, this counts as two separate turns.","enunciado":"Select TWO corrections to these assumptions, per the documented lifecycle.","opciones":[{"id":"A","texto":"The SDK executes the two Read calls and the Grep call concurrently since they are read-only, but runs the Edit call sequentially relative to the others, since it modifies state and could conflict with reads of the same file — not all four run concurrently.","correcta":true,"justificacion":"The SDK executes read-only tool calls (Read, Glob, Grep, read-only MCP) concurrently within a turn but serializes state-modifying calls (Edit, Write, Bash) to avoid write conflicts."},{"id":"B","texto":"All four tool calls, their execution, and the resulting tool results returned to Claude constitute a single turn, regardless of how many distinct tool types were involved.","correcta":true,"justificacion":"A turn is one full round — response with tool calls, execution, and results returned — without the application ceding control; the number of distinct tool categories exercised inside it doesn't split it into multiple turns."},{"id":"C","texto":"Because Edit modifies state, the SDK executes all four tool calls sequentially, one at a time, to guarantee no conflicts of any kind.","correcta":false,"justificacion":"This over-serializes: the SDK still runs the read-only calls concurrently with each other; only the state-modifying call is handled sequentially relative to the batch, not the entire set one-at-a-time."},{"id":"D","texto":"Because three of the four calls are read-only, the SDK treats the entire batch as read-only and executes all four concurrently, including the Edit call.","correcta":false,"justificacion":"This is the documented anti-pattern of assuming full-batch concurrency; state-modifying calls are always serialized regardless of how many read-only calls accompany them."},{"id":"E","texto":"This is two turns, since the read-only tool calls and the state-modifying tool call are dispatched in separate lifecycle phases.","correcta":false,"justificacion":"Concurrent vs. sequential execution within a turn is an internal scheduling detail; it doesn't split the turn, which is defined by one full response-execute-return cycle."}],"seleccionar":2,"dificultad":"dificil","refSeccion":"#ts-4-1","fuentes":["https://code.claude.com/docs/en/agent-sdk/agent-loop"]},{"id":"b4-q18","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.7","escenario":"An engineer forks a session with fork_session=True to explore an OAuth2 alternative to an already-implemented JWT approach. The forked agent edits several files in the project directory to prototype the OAuth2 flow. Meanwhile, someone else resumes the original, non-forked session in the same directory and is surprised to see the OAuth2 file edits already present, since they expected the fork to be fully isolated.","enunciado":"What is the correct explanation for this behavior?","opciones":[{"id":"A","texto":"Forking branches only the conversation history into an independent copy; it does not fork the filesystem — file edits made by the forked agent are real, on-disk changes visible to any other session working in the same directory, including the original.","correcta":true,"justificacion":"Fork branches the conversation history, not the filesystem; achieving filesystem isolation as well would require separate file checkpointing, which is documented as a distinct, additional mechanism."},{"id":"B","texto":"This is a bug; fork_session=True should have prevented any filesystem changes from being visible outside the forked session.","correcta":false,"justificacion":"This is documented, expected behavior, not a bug: fork only branches conversation history, and full isolation of file changes needs separate file checkpointing."},{"id":"C","texto":"The original session's session_id must have been reused for the fork instead of getting an independent ID, causing the file changes to bleed through.","correcta":false,"justificacion":"Forking produces two independent session IDs; the file visibility issue is about the shared filesystem between sessions, not about session ID reuse."},{"id":"D","texto":"continue_conversation=True was set instead of fork_session=True, which shares state fully.","correcta":false,"justificacion":"The scenario explicitly used fork_session=True; continue is an unrelated mechanism for finding the most recent session and isn't what caused the shared file visibility here."}],"seleccionar":1,"dificultad":"dificil","refSeccion":"#ts-4-7","fuentes":["https://code.claude.com/docs/en/agent-sdk/sessions"]},{"id":"b0-q05","bloque":0,"dominio":null,"taskStatement":"0.2","escenario":"A compliance workflow requires two independent guarantees for its extract_data tool: (1) Claude must call some tool on that turn, never respond with plain text, and (2) the input it produces must conform exactly to the JSON Schema, with no missing required fields or type mismatches.","enunciado":"Select TWO configuration changes that together provide both guarantees, per the documented behavior of tool definitions and tool_choice.","opciones":[{"id":"A","texto":"Set tool_choice to {\"type\": \"any\"} so Claude must call one of the available tools.","correcta":true,"justificacion":"\"any\" forces Claude to call a tool rather than respond with text only, which is exactly the first required guarantee."},{"id":"B","texto":"Set strict: true on the tool's definition so its input is validated via grammar-constrained sampling against the schema.","correcta":true,"justificacion":"strict guarantees schema conformance of the input whenever the tool is called, independent of tool_choice, satisfying the second required guarantee; combined with \"any\" it gives the documented compound guarantee of call + schema compliance."},{"id":"C","texto":"Add 10 or more input_examples so the model reliably infers the required fields.","correcta":false,"justificacion":"input_examples improves the model's understanding of formats and optional parameters but is not a validation mechanism and provides no hard guarantee of schema conformance or that the tool will be called."},{"id":"D","texto":"Keep tool_choice at \"auto\" and add a strongly worded system prompt insisting the tool must always be called.","correcta":false,"justificacion":"\"auto\" leaves the decision to the model; prompt-based insistence is probabilistic compliance, not the deterministic guarantee the scenario requires."},{"id":"E","texto":"Consolidate extract_data with related tools under a single action parameter.","correcta":false,"justificacion":"Consolidation addresses tool-selection ambiguity across a large catalog; it does not, by itself, guarantee that a tool is always called or that its input conforms to the schema."}],"seleccionar":2,"dificultad":"media","refSeccion":"#ts-0-2","fuentes":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools","https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use"]},{"id":"b4-q11","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.4","escenario":"A customer message mixes three concerns: a billing dispute, a shipping complaint, and a product defect report. The agent currently treats it as a single monolithic request and produces one long combined resolution, missing the shipping complaint entirely in its final response.","enunciado":"What is the correct approach per the documented multi-step workflow pattern?","opciones":[{"id":"A","texto":"Decompose the request into separate items (billing, shipping, defect), investigate each with shared context, and synthesize a single unified resolution that explicitly addresses all three.","correcta":true,"justificacion":"The documented pattern for multi-concern requests is exactly this: decompose into items, investigate in parallel sharing context, then synthesize one unified resolution, which prevents concerns like the shipping complaint from being dropped."},{"id":"B","texto":"Escalate the entire message to a human agent, since it mixes multiple concerns.","correcta":false,"justificacion":"Mixing concerns doesn't by itself require human escalation; the documented pattern is decomposition and synthesis, reserving escalation for cases with financial or security consequences or unresolved gaps."},{"id":"C","texto":"Process only the first concern mentioned and ask the customer to submit separate messages for the others.","correcta":false,"justificacion":"This isn't the documented pattern and creates poor customer experience by ignoring concerns that could be resolved in one pass with shared context."},{"id":"D","texto":"Route the whole message to a single specialized billing subagent, since billing was mentioned first.","correcta":false,"justificacion":"This ignores the shipping and defect concerns entirely instead of decomposing the request into separate items to be investigated and synthesized."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-4-4","fuentes":["exam-guide-oficial-v1.0.txt (Task Statement 1.4)"]},{"id":"b1-q06","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.2","escenario":"An extraction schema already marks middle_name as optional/nullable, since not every source document includes it. Logs still show the model occasionally producing plausible-looking fabricated middle names when the field is absent from the source.","enunciado":"What additional fix, per documented few-shot guidance, best addresses this residual fabrication?","opciones":[{"id":"A","texto":"Add a few-shot example demonstrating a document where the field is legitimately absent, with the expected output showing null rather than a fabricated value.","correcta":true,"justificacion":"A few-shot example showing legitimate absence mapped to null teaches the distinction between 'absent' and 'must be invented' — the documented use of examples to reduce hallucination in extraction, on top of the field already being optional."},{"id":"B","texto":"Mark the field as required instead of optional, forcing an explicit decision.","correcta":false,"justificacion":"Marking the field required would reintroduce the pressure to fabricate a value whenever the source lacks it — the opposite of the needed fix."},{"id":"C","texto":"Enable strict: true on the tool if not already enabled.","correcta":false,"justificacion":"strict: true validates structural/type conformance of whatever value is produced; it does not stop the model from producing a plausible-looking fabricated value that still conforms to the schema."},{"id":"D","texto":"Add more examples of common, non-edge documents that do include the field.","correcta":false,"justificacion":"More examples of common, non-edge cases don't teach the specific 'field can be legitimately absent' distinction; only an example demonstrating that exact case does."}],"seleccionar":1,"dificultad":"dificil","refSeccion":"#ts-1-2","fuentes":["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"]},{"id":"b3-q07","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.2","escenario":"A search_records tool executes successfully against a well-formed query but finds zero matching rows. The current implementation returns isError: true with the text \"No results found\", causing a supervising agent to treat every empty search as a failed subtask and escalate to a human reviewer.","enunciado":"What is the correct fix for this behavior?","opciones":[{"id":"A","texto":"Return isError: false with empty content, since a successfully executed query with no matches is a valid success outcome, distinct from an execution failure.","correcta":true,"justificacion":"A query that runs successfully but finds no results is documented as a success case with empty content, not an error; conflating the two breaks the agent's ability to interpret what actually happened."},{"id":"B","texto":"Keep isError: true but add errorCategory: \"business\" so the coordinator can distinguish it from a timeout.","correcta":false,"justificacion":"This still misrepresents a valid success as an error; adding a category doesn't correct the core mislabeling of a zero-result success as a failure."},{"id":"C","texto":"Add isRetryable: true so the agent retries the query in case results appear later.","correcta":false,"justificacion":"Treating a legitimate zero-result outcome as retryable causes wasteful repeated retries for a query that already executed correctly."},{"id":"D","texto":"Return isError: true only when the search runs three times with no results, to filter out transient index lag.","correcta":false,"justificacion":"This introduces an arbitrary retry cap unrelated to the documented isError contract, and still doesn't fix that a successfully executed zero-match query is not an error at all."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-3-2","fuentes":["https://modelcontextprotocol.io/docs/develop/build-server"]},{"id":"b5-q14","bloque":5,"dominio":"Context Management & Reliability","taskStatement":"5.5","escenario":"A field-level confidence score of 0.95 is reported for a batch of extracted values, but a manual audit of that same high-confidence batch finds true accuracy closer to 60%.","enunciado":"What is the correct fix so these confidence scores can be trusted for routing extractions to human review?","opciones":[{"id":"A","texto":"Calibrate the confidence scores against a labeled validation set before using them to route review decisions, since an uncalibrated score can report high confidence even when true accuracy is much lower.","correcta":true,"justificacion":"Calibration against a labeled validation set is the documented fix for a confidence score that reports high confidence while true accuracy is much lower."},{"id":"B","texto":"Report confidence scores with more decimal precision (e.g., 0.953 instead of 0.95) to support finer-grained routing decisions.","correcta":false,"justificacion":"Added precision doesn't fix the underlying miscalibration; a more precise but still uncalibrated number is just as misleading."},{"id":"C","texto":"Replace field-level confidence scores with a single document-level score to simplify the routing logic.","correcta":false,"justificacion":"This regresses toward the same aggregation problem confidence calibration is meant to avoid — a document-level average can mask poor performance on specific fields."},{"id":"D","texto":"Have a second model independently re-score each extraction and average the two scores as the final confidence.","correcta":false,"justificacion":"Without calibration against ground truth, averaging two uncalibrated scores doesn't establish any real relationship between the reported number and actual accuracy."}],"seleccionar":1,"dificultad":"dificil","refSeccion":"#ts-5-5"},{"id":"b1-q04","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.2","escenario":"A review tool's prompt lists the required output fields (location, issue, severity, suggested_fix) in detailed text instructions, but the JSON produced still varies in structure across runs, especially for multi-line issues.","enunciado":"What is the most effective fix per documented few-shot guidance?","opciones":[{"id":"A","texto":"Add 2-4 targeted <example> blocks showing the exact output_format for representative edge cases, including multi-line issues.","correcta":true,"justificacion":"2-4 targeted examples showing the exact output_format for representative edge cases is the documented fix for output that remains inconsistent despite detailed instructions; the tags clearly separate examples from instructions."},{"id":"B","texto":"Repeat and intensify the same textual instructions about required fields.","correcta":false,"justificacion":"Repeating or intensifying the same instructions doesn't give the model a concrete pattern to match; examples, not more emphatic instructions, are what fix format inconsistency."},{"id":"C","texto":"Switch to a more capable model for this task.","correcta":false,"justificacion":"Switching models doesn't address a prompt design problem; the inconsistency stems from the prompt lacking concrete examples, not from model capability."},{"id":"D","texto":"Increase max_tokens so the JSON has more room to be formatted correctly.","correcta":false,"justificacion":"max_tokens caps the output token budget; it has no effect on whether the JSON format itself is applied consistently across runs."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-1-2","fuentes":["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"]},{"id":"b3-q01","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.1","escenario":"Your search_docs tool has the description \"Searches documents.\" Production traces show Claude invoking it for questions about internal HR policies, historical financial reports, and live customer support tickets alike, then failing when the underlying index doesn't cover certain content types.","enunciado":"What is the most effective fix for this tool selection problem?","opciones":[{"id":"A","texto":"Rewrite the description to state exactly what corpus the tool indexes, what it returns, and the boundary cases where it should not be used.","correcta":true,"justificacion":"description is the model's only channel for deciding when and how to call a tool; a minimal description without scope or boundaries directly causes this kind of misrouting across unrelated content types."},{"id":"B","texto":"Add input_examples covering typical HR, financial, and support queries.","correcta":false,"justificacion":"input_examples clarify ambiguous input formats and patterns; they don't communicate what corpus the tool actually covers, which is the real cause of misrouting here."},{"id":"C","texto":"Set tool_choice to \"any\" so the tool is always called.","correcta":false,"justificacion":"\"any\" only forces some tool to be called; it does nothing to fix which content types search_docs is appropriate for, and would force a call even when no tool applies."},{"id":"D","texto":"Consolidate search_docs into a broader search_everything tool.","correcta":false,"justificacion":"Widening scope further would make the ambiguity worse, not better; the documented fix for an underspecified description is to tighten and clarify its boundaries, not broaden them."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-3-1","fuentes":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"]},{"id":"b2-q15","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.5","escenario":"A code review surfaces two issues in the same caching module: the cache invalidation logic doesn't account for a new eviction policy, and the eviction policy itself has an off-by-one error that only manifests once invalidation is triggered correctly. The developer reports the eviction bug in one message, waits for a fix and confirmation, then reports the invalidation issue in a second, separate message.","enunciado":"Is this the correct way to sequence these two corrections, per documented guidance on grouping feedback?","opciones":[{"id":"A","texto":"No — because the two issues interact (the invalidation fix can't be verified without the eviction bug fixed, and vice versa), they should have been reported together in a single detailed message.","correcta":true,"justificacion":"The documented criterion is that problems which interact with each other should be communicated together in one detailed message, while independent problems are corrected sequentially; these two issues clearly interact."},{"id":"B","texto":"Yes — any two bugs found in the same code review should always be reported in separate sequential messages to keep each fix isolated.","correcta":false,"justificacion":"The documented rule depends on whether the issues interact, not on always separating feedback; interacting issues are specifically meant to be bundled together."},{"id":"C","texto":"No — but only because eviction should always be fixed before invalidation, regardless of whether the issues interact.","correcta":false,"justificacion":"The documented criterion for combining feedback is interaction between problems, not a fixed ordering rule that favors one particular type of issue over another."},{"id":"D","texto":"Yes — sequential messages are correct because giving Claude more than one issue at a time contaminates the context, regardless of whether the issues are related.","correcta":false,"justificacion":"The documented guidance doesn't treat multiple issues in one message as inherently contaminating; it explicitly recommends bundling interacting issues into a single detailed message."}],"seleccionar":1,"dificultad":"dificil","refSeccion":"#ts-2-5","fuentes":["https://code.claude.com/docs/en/best-practices"]},{"id":"b3-q10","bloque":3,"dominio":"Tool Design & MCP Integration","taskStatement":"2.3","escenario":"A refund workflow relies on tool_choice: \"auto\" and a system prompt instructing the agent to always call authenticate_customer before process_refund. Logs show that in a meaningful fraction of sessions, the agent calls process_refund directly.","enunciado":"What is the most effective fix, per the documented pattern for enforcing critical order?","opciones":[{"id":"A","texto":"For the required first step, force the exact tool with tool_choice: {\"type\": \"tool\", \"name\": \"authenticate_customer\"}, guaranteeing the sequence rather than relying on prompt compliance alone.","correcta":true,"justificacion":"When step order is critical, forcing the specific first tool guarantees the sequence; relying on \"auto\" plus prompt instructions is documented as insufficient for non-negotiable ordering."},{"id":"B","texto":"Strengthen the system prompt wording and add several few-shot examples reinforcing the required order, while keeping tool_choice at \"auto\".","correcta":false,"justificacion":"This still relies on probabilistic prompt compliance for a non-negotiable order requirement, which is documented to fail in a meaningful fraction of cases."},{"id":"C","texto":"Set tool_choice to \"any\" so the agent must call some tool on every turn.","correcta":false,"justificacion":"\"any\" guarantees that some tool is called, but not which one or in what order; it does not prevent process_refund from being called before authenticate_customer."},{"id":"D","texto":"Consolidate authenticate_customer and process_refund into a single tool with an action parameter.","correcta":false,"justificacion":"Consolidation addresses catalog granularity, not enforcement of a required call order; it does not guarantee that authentication happens before the refund is processed."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-3-3","fuentes":["https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools"]},{"id":"b4-q05","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.2","escenario":"Your research coordinator always invokes all five available subagents (search, analysis, synthesis, fact-check, formatting) for every incoming query, including simple ones like \"what is the capital of France,\" which needs only a single lookup.","enunciado":"What change best aligns with the documented coordinator responsibilities?","opciones":[{"id":"A","texto":"Have the coordinator perform dynamic subagent selection, invoking only the subagents warranted by the query's actual complexity, reserving the full pipeline for genuinely complex queries.","correcta":true,"justificacion":"Dynamic subagent selection based on complexity is one of the coordinator's four core responsibilities; always routing through the full pipeline regardless of complexity is the documented anti-pattern of unnecessary cost and latency."},{"id":"B","texto":"Increase the concurrency limit so all five subagents complete faster in parallel.","correcta":false,"justificacion":"Running the unnecessary subagents faster doesn't address the actual problem: they shouldn't be invoked at all for a trivial single-lookup query."},{"id":"C","texto":"Consolidate the five subagents into a single subagent with an internal action parameter it selects itself.","correcta":false,"justificacion":"This solves a tool-selection ambiguity problem; it doesn't address the coordinator's failure to scale subagent invocation to query complexity."},{"id":"D","texto":"Cap the number of subagents that can be invoked per query at two, regardless of complexity.","correcta":false,"justificacion":"An arbitrary fixed cap is the same category of anti-pattern as an iteration cap used as a primary control mechanism; it doesn't adapt to actual query complexity in either direction."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-4-2","fuentes":["https://code.claude.com/docs/en/agent-sdk/subagents","https://www.anthropic.com/engineering/built-multi-agent-research-system"]},{"id":"b4-q14","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.5","escenario":"Multiple MCP tools return timestamps in inconsistent formats — some as Unix epoch integers, others as ISO 8601 strings — before Claude ever sees them. An engineer wants every timestamp normalized to ISO 8601 before the model processes the tool's output, without asking Claude to do the conversion itself.","enunciado":"What is the correct implementation for this normalization requirement?","opciones":[{"id":"A","texto":"Register a PostToolUse hook that inspects the raw tool output and returns hookSpecificOutput.updatedToolOutput with the normalized ISO 8601 value, replacing the output before Claude receives it.","correcta":true,"justificacion":"PostToolUse runs after the tool returns and updatedToolOutput is exactly the documented field for replacing the tool's output before the model processes it, matching the normalization use case."},{"id":"B","texto":"Register a PreToolUse hook that rewrites tool_input before execution to request pre-formatted timestamps.","correcta":false,"justificacion":"The timestamps to normalize appear in the tool's output, not its input; PreToolUse runs before execution and cannot see a result that doesn't exist yet."},{"id":"C","texto":"Add updatedInput to a PreToolUse hook's hookSpecificOutput to reformat the expected output ahead of time.","correcta":false,"justificacion":"updatedInput modifies the tool's input before execution, not its output; it cannot be used to reformat a result that hasn't been produced yet."},{"id":"D","texto":"Instruct Claude via the system prompt to always convert timestamps to ISO 8601 before using them in reasoning.","correcta":false,"justificacion":"This is a prompt-based, probabilistic approach to a deterministic normalization need that a PostToolUse hook can guarantee outside the model's reasoning entirely."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-4-5","fuentes":["https://code.claude.com/docs/en/agent-sdk/hooks"]},{"id":"b5-q03","bloque":5,"dominio":"Context Management & Reliability","taskStatement":"5.1","escenario":"A team building on Claude Sonnet 4.5 adds custom logic that tracks estimated token usage after every tool call and manually injects warning text into the prompt when a threshold is crossed, believing this tracking must be built by hand.","enunciado":"Is this custom tracking layer necessary given the documented behavior of context awareness on this model family?","opciones":[{"id":"A","texto":"No — Claude Sonnet 5, Sonnet 4.6, Sonnet 4.5, and Haiku 4.5 already inject a token budget tag at conversation start and a system_warning update after each tool call automatically, letting the model track its own remaining budget without developer intervention.","correcta":true,"justificacion":"Context awareness on these models is automatic: the API injects <budget:token_budget> at the start and <system_warning> updates after each tool call, so a hand-built duplicate layer is unnecessary."},{"id":"B","texto":"Yes — context awareness is an opt-in flag that must be explicitly enabled per request, so without it no budget tracking happens at all.","correcta":false,"justificacion":"Context awareness is automatic on the supported models, not a request-level opt-in flag; no such setting exists in the documented behavior."},{"id":"C","texto":"Yes — context awareness only mitigates lost-in-the-middle degradation, not token budget truncation, so a separate tracking layer is still required for budget awareness.","correcta":false,"justificacion":"This mischaracterizes context awareness, which is specifically the mechanism for tracking remaining token budget via the injected tags, not a lost-in-the-middle fix."},{"id":"D","texto":"No — but only because the team already maintains a persistent case-facts block, which makes budget tracking unnecessary.","correcta":false,"justificacion":"Case-facts blocks and context awareness solve different problems (preserving specific transactional values vs. tracking overall token budget); one doesn't substitute for the other."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-5-1","fuentes":["https://platform.claude.com/docs/en/build-with-claude/context-windows"]},{"id":"b4-q01","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.1","escenario":"Your team built a custom wrapper around the Agent SDK's query() generator. The wrapper treats the agentic loop as finished as soon as an AssistantMessage contains any text block, even when that same message also contains tool_use blocks in its content array. QA reports the wrapper exits mid-task in roughly 15% of runs while Claude is still mid-investigation.","enunciado":"What is the root cause of this premature termination, and the correct fix?","opciones":[{"id":"A","texto":"The wrapper conflates presence of text with completion; Claude can return text and tool calls in the same turn. The correct signal is the absence of tool calls in the response, not the presence of text, so the wrapper should check whether the content array contains any tool_use blocks.","correcta":true,"justificacion":"The loop continues while Claude's response includes tool calls and ends only when it doesn't; treating any text as a completion signal ignores that Claude frequently returns text alongside tool calls in the same turn."},{"id":"B","texto":"Increase maxTurns so the wrapper has more turns available before it decides to stop.","correcta":false,"justificacion":"maxTurns is a safety net against runaway loops, not the mechanism that determines whether a given turn is finished; raising it doesn't fix a flawed per-turn completion check."},{"id":"C","texto":"Parse the assistant's text for completion phrases like \"I'm done\" or \"finished\" before deciding to stop.","correcta":false,"justificacion":"Parsing natural-language signals to infer loop termination is a documented anti-pattern: an agent doesn't reliably produce those explicit phrases."},{"id":"D","texto":"Treat every AssistantMessage as complete once its content array is non-empty, since an empty array indicates the loop hasn't started.","correcta":false,"justificacion":"Content array emptiness doesn't distinguish a finished turn from one still requesting tool calls; the correct check is specifically for the presence or absence of tool_use blocks."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-4-1","fuentes":["https://code.claude.com/docs/en/agent-sdk/agent-loop"]},{"id":"b2-q04","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.2","escenario":"A project has both a custom slash command at `.claude/commands/deploy.md` and, added later by another engineer, a skill at `.claude/skills/deploy/SKILL.md`. Both are meant to handle the same `/deploy` workflow but now have diverging content.","enunciado":"When a user runs `/deploy`, which one is invoked per documented precedence rules?","opciones":[{"id":"A","texto":"The skill at `.claude/skills/deploy/SKILL.md` takes precedence over the command with the same name.","correcta":true,"justificacion":"When a skill and a command share the same name, the skill has documented precedence over the command."},{"id":"B","texto":"The command takes precedence because commands were introduced before skills.","correcta":false,"justificacion":"No such precedence rule based on introduction order exists; the documented behavior is that the skill wins on a naming collision."},{"id":"C","texto":"Both run, in the order they were created.","correcta":false,"justificacion":"There is no documented stacking behavior where both a command and a same-named skill execute together."},{"id":"D","texto":"Neither runs, and Claude Code raises a naming-conflict error.","correcta":false,"justificacion":"No error is raised for this collision; the skill silently takes precedence over the identically named command."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-2-2","fuentes":["https://code.claude.com/docs/en/skills"]},{"id":"b2-q06","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.2","escenario":"An engineer maintains a personal variant of a project skill in `~/.claude/skills/deploy-personal/SKILL.md` and changes its frontmatter `name: quick-deploy`, expecting the invocable command to become `/quick-deploy` instead of `/deploy-personal`.","enunciado":"After the change, typing `/quick-deploy` does nothing, while `/deploy-personal` still works. What explains this?","opciones":[{"id":"A","texto":"The `name` field only changes the label displayed for the skill; the invocable command is determined by the skill's directory (or file) name, so renaming the directory to `quick-deploy` is required.","correcta":true,"justificacion":"This is the documented anti-pattern: name only changes what's shown, not the invoked command, which is tied to the directory or file name and requires actually renaming it."},{"id":"B","texto":"`disable-model-invocation` was implicitly set to `true` by adding a custom `name`, blocking manual invocation.","correcta":false,"justificacion":"There is no documented interaction between setting name and disable-model-invocation; disable-model-invocation only affects automatic invocation by the model, not manual /command usage."},{"id":"C","texto":"Personal skills under `~/.claude/skills/` cannot define a custom `name` field at all.","correcta":false,"justificacion":"No such restriction exists; name is an ordinary frontmatter field usable regardless of whether the skill is at user or project scope."},{"id":"D","texto":"The skill must also define an `argument-hint` before a renamed command becomes invocable.","correcta":false,"justificacion":"argument-hint only controls the hint shown during autocompletion; it has no bearing on which command name actually triggers the skill."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-2-2","fuentes":["https://code.claude.com/docs/en/skills","https://code.claude.com/docs/en/claude-directory"]},{"id":"b1-q12","bloque":1,"dominio":"Prompt Engineering & Structured Output","taskStatement":"4.4","escenario":"A code review extraction pipeline needs to (1) later analyze systematically which finding categories developers dismiss most often, and (2) auto-detect when an invoice's declared total conflicts with the sum of its line items.","enunciado":"Select TWO schema/field design changes that directly enable these two capabilities.","opciones":[{"id":"A","texto":"Add a detected_pattern field to each finding labeling which code construct triggered it.","correcta":true,"justificacion":"A detected_pattern field labeling the code construct that triggered each finding is the documented design that enables systematic analysis later of which finding categories get dismissed at what rate."},{"id":"B","texto":"Extract calculated_total, stated_total, and a conflict_detected boolean in the invoice schema.","correcta":true,"justificacion":"Extracting both the calculated and stated totals plus a conflict_detected boolean is the documented pattern for surfacing inconsistent data at the source, letting the conflict be detected automatically."},{"id":"C","texto":"Mark every field in both schemas as required.","correcta":false,"justificacion":"Marking every field required forces the model to fabricate values whenever the source is incomplete; it does nothing to enable dismissal-rate analysis or total-conflict detection."},{"id":"D","texto":"Increase max_tokens on both extraction calls.","correcta":false,"justificacion":"max_tokens bounds the output budget; it has no relationship to enabling categorical dismissal analysis or detecting total mismatches."},{"id":"E","texto":"Add strict: true to both tools without adding any new fields.","correcta":false,"justificacion":"strict: true alone guarantees schema conformance of whatever fields already exist; without adding the specific fields needed, it provides neither capability the scenario requires."}],"seleccionar":2,"dificultad":"dificil","refSeccion":"#ts-1-4","fuentes":[]},{"id":"b4-q15","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.6","escenario":"You need to run a standard code review across 40 files, checking each individually for bugs and security issues, followed by a cross-file integration pass — a review structure your team runs the same way every sprint.","enunciado":"Which decomposition strategy fits this task, per the documented selection criteria?","opciones":[{"id":"A","texto":"Prompt chaining — a fixed sequence of a per-file analysis pass followed by a separate integration pass — since this is a predictable, multi-aspect review, not open-ended investigation.","correcta":true,"justificacion":"Prompt chaining is reserved for predictable, multi-aspect reviews; splitting into a local per-file pass and a separate cross-file integration pass is the documented fix for the attention dilution of a single monolithic pass."},{"id":"B","texto":"Dynamic adaptive decomposition, since the plan should adapt as file dependencies are discovered.","correcta":false,"justificacion":"Dynamic decomposition is reserved for open-ended tasks; this recurring, predictable review structure is exactly the case where a fixed prompt-chaining sequence is the documented correct choice."},{"id":"C","texto":"A single monolithic pass across all 40 files at once to save tool calls.","correcta":false,"justificacion":"A monolithic single pass over a whole codebase is the documented anti-pattern that produces attention dilution and inconsistent findings."},{"id":"D","texto":"Coordinator-subagent orchestration with one subagent spawned per file in parallel.","correcta":false,"justificacion":"This addresses multi-agent orchestration, a different mechanism than the task decomposition strategy (sequencing analysis into per-file and integration passes) the scenario calls for."}],"seleccionar":1,"dificultad":"facil","refSeccion":"#ts-4-6","fuentes":["exam-guide-oficial-v1.0.txt (Task Statement 1.6)"]},{"id":"b4-q16","bloque":4,"dominio":"Agentic Architecture & Orchestration","taskStatement":"1.6","escenario":"You're asked to \"add exhaustive tests to this legacy codebase\" with no existing coverage data, no known priority order, and undocumented cross-module dependencies that only emerge as you look deeper into the code.","enunciado":"What is the correct decomposition strategy here?","opciones":[{"id":"A","texto":"Dynamic adaptive decomposition — first map the codebase structure and identify high-impact untested areas, generate a prioritized plan, and adapt that plan as previously unknown dependencies are discovered.","correcta":true,"justificacion":"This open-ended task is exactly the documented case for dynamic decomposition: mapping structure, prioritizing high-impact areas, and adapting the plan as dependencies emerge, since they can't be anticipated upfront."},{"id":"B","texto":"Prompt chaining with a fixed per-module test-writing sequence decided entirely upfront.","correcta":false,"justificacion":"Fixing the decomposition rigidly for an open-ended task fails because findings discovered during the work can reveal needs not anticipated at the start."},{"id":"C","texto":"A single pass instructing the agent to \"write tests for the whole codebase\" in one shot.","correcta":false,"justificacion":"A monolithic single pass produces the documented attention dilution problem and inconsistent, incomplete coverage on a task of this scope."},{"id":"D","texto":"Fix the test-writing order strictly by alphabetical file name to keep the plan deterministic.","correcta":false,"justificacion":"An arbitrary ordering ignores actual impact and discovered dependencies, which is precisely what dynamic decomposition is meant to prioritize instead."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-4-6","fuentes":["exam-guide-oficial-v1.0.txt (Task Statement 1.6)"]},{"id":"b2-q02","bloque":2,"dominio":"Claude Code Configuration & Workflows","taskStatement":"3.1","escenario":"The team's project-level CLAUDE.md has grown to 340 lines covering build commands, testing conventions, three different deployment procedures, and API design guidelines. Engineers report that Claude increasingly ignores the deployment section entirely, even though it hasn't changed in months.","enunciado":"What is the most effective fix, per the documented behavior of CLAUDE.md sizing?","opciones":[{"id":"A","texto":"Split the deployment procedures and other topic-specific sections into `@import`-ed files or `.claude/rules/`, reducing the main CLAUDE.md below the ~200-line guideline.","correcta":true,"justificacion":"Files above the ~200-line guideline dilute adherence because important instructions get lost in the noise; the documented fix is modularizing with @import or moving content to .claude/rules/."},{"id":"B","texto":"Rewrite the deployment section in more forceful language (\"YOU MUST always follow these steps exactly\").","correcta":false,"justificacion":"The documented cause here is file length diluting adherence, not phrasing strength; a longer, more emphatic section would make the size problem worse, not better."},{"id":"C","texto":"Move the entire CLAUDE.md to `~/.claude/CLAUDE.md` so it loads earlier in the hierarchy.","correcta":false,"justificacion":"User-level CLAUDE.md is personal and isn't shared via version control, so this would stop the team from receiving the content at all; it also doesn't address the length-dilution problem."},{"id":"D","texto":"Enable `disable-model-invocation: true` on the CLAUDE.md file.","correcta":false,"justificacion":"That frontmatter field is documented for skills, not CLAUDE.md; CLAUDE.md has no such field and always loads at session start."}],"seleccionar":1,"dificultad":"media","refSeccion":"#ts-2-1","fuentes":["https://code.claude.com/docs/en/memory"]}]};
// __PREGUNTAS_JSON_END__

(function () {
  "use strict";
  const cfg = DATA.config, bank = DATA.preguntas;
  const KEY = "ccarf-quiz-" + cfg.titulo + "-v" + cfg.version;
  const app = document.getElementById("app");
  document.getElementById("q-title").textContent = cfg.titulo;
  document.getElementById("q-eyebrow").textContent = "CCAR-F · BLOQUE " + String(cfg.bloque).toUpperCase();
  document.title = cfg.solo_examen ? "Simulacro de examen CCAR-F" : "Quiz CCAR-F · " + cfg.titulo;

  let S = null; // state: {mode, order[], optOrder{}, answers{}, flags[], idx, remaining, finished, revealed{}}

  // Funcionalidad "Continuar": marca "ccarf-sum-quiz-<bloque>.updated" como
  // timestamp de último acceso a este quiz en CADA carga de página, aunque
  // no se responda nada (syncSummary() ya lo actualiza al interactuar, pero
  // solo abrir la portada no la llama). Se fusiona con el resumen existente
  // -- nunca lo reemplaza -- para no perder "best"/"hits"/etc. de intentos
  // previos. El índice del curso compara este campo con el equivalente de
  // "ccarf-sum-guia-<bloque>.updated" para el botón global "Continuar".
  (function touchAccess() {
    try {
      let prev = {}; try { prev = JSON.parse(localStorage.getItem("ccarf-sum-quiz-" + cfg.bloque)) || {}; } catch (e) {}
      prev.bloque = cfg.bloque; prev.titulo = cfg.titulo; prev.version = cfg.version;
      prev.updated = Date.now();
      localStorage.setItem("ccarf-sum-quiz-" + cfg.bloque, JSON.stringify(prev));
    } catch (e) {}
  })();

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const byId = id => bank.find(q => q.id === id);
  const save = () => { localStorage.setItem(KEY, JSON.stringify(S)); syncSummary(); };
  // Progress summary consumed by the course index (dist/index.html).
  function syncSummary() {
    if (S && S.subset) return;   // un repaso parcial no pisa la nota del intento completo
    try {
      const answered = Object.keys(S.answers).filter(k => (S.answers[k] || []).length).length;
      let prev = {}; try { prev = JSON.parse(localStorage.getItem("ccarf-sum-quiz-" + cfg.bloque)) || {}; } catch (e) {}
      const sum = { bloque: cfg.bloque, titulo: cfg.titulo, version: cfg.version, mode: S.mode,
        answered, total: bank.length, finished: !!S.finished, best: prev.best || 0, updated: Date.now() };
      if (S.finished) {
        const hits = S.order.filter(id => isCorrect(byId(id))).length;
        sum.hits = hits;
        sum.scaled = Math.round(100 + hits / bank.length * 900);
        sum.best = Math.max(sum.best, sum.scaled);
      }
      localStorage.setItem("ccarf-sum-quiz-" + cfg.bloque, JSON.stringify(sum));
    } catch (e) {}
  }
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  // refSeccion apunta al documento de referencia, que no se publica. Se traduce
  // a la leccion equivalente de la guia del bloque, que si esta en el sitio.
  function leccionDe(q) {
    const m = /^#cap-(\d+)-ts-(\d+)$/.exec(q.refSeccion || "");
    if (!m) return null;
    return { href: "../bloque-" + m[1] + "/guia_v1.2.html#leccion-" + m[2],
             texto: "Bloque " + m[1] + ", Lección " + m[2] };
  }
  const isCorrect = q => {
    const sel = (S.answers[q.id] || []).slice().sort().join(",");
    const ok = q.opciones.filter(o => o.correcta).map(o => o.id).sort().join(",");
    return sel === ok && sel !== "";
  };

  function startScreen() {
    const saved = load();
    let html = '<div class="card"><h2>Configuración</h2>';
    if (saved && !saved.finished) html += '<p>Hay un intento guardado (' + (saved.mode === "examen" ? "modo examen" : "modo estudio") + ', pregunta ' + (saved.idx + 1) + '). </p><div class="actions"><button class="primary" id="resume">Reanudar intento</button></div><hr>';
    html += '<p>Elige modo:</p><div class="actions">';
    if (!cfg.solo_examen) html += '<button class="primary" id="m-estudio">Modo estudio</button>';
    html += '<button ' + (cfg.solo_examen ? 'class="primary"' : '') + ' id="m-examen">Modo examen</button></div>';
    html += '<p class="muted">Estudio: corrección y justificación inmediatas. Examen: temporizador de ' + examMinutes() + ' min, resultados al final con desglose por dominio.</p></div>';
    app.innerHTML = html;
    const r = document.getElementById("resume");
    if (r) r.onclick = () => { S = saved; render(); };
    const e1 = document.getElementById("m-estudio");
    if (e1) e1.onclick = () => init("estudio");
    document.getElementById("m-examen").onclick = () => init("examen");
  }

  function examMinutes() { return cfg.duracion_examen_min || Math.ceil(bank.length * 2); }

  function init(mode, ids) {
    // ids: subconjunto (repaso de falladas). Un repaso no es un intento puntuable.
    const lista = ids && ids.length ? ids : bank.map(q => q.id);
    S = { mode, order: shuffle(lista), subset: !!(ids && ids.length), optOrder: {}, answers: {}, flags: [], idx: 0, remaining: examMinutes() * 60, finished: false, revealed: {} };
    bank.forEach(q => S.optOrder[q.id] = shuffle(q.opciones.map(o => o.id)));
    save(); render();
  }

  let tick = null;
  function startTimer(el) {
    clearInterval(tick);
    tick = setInterval(() => {
      S.remaining--; save();
      if (el.isConnected) { el.textContent = fmt(S.remaining); el.classList.toggle("low", S.remaining < 300); }
      if (S.remaining <= 0) { clearInterval(tick); finishExam(); }
    }, 1000);
  }

  function render() {
    if (S.finished) return results();
    const q = byId(S.order[S.idx]);
    const multi = q.seleccionar > 1, type = multi ? "checkbox" : "radio";
    const sel = S.answers[q.id] || [];
    const revealed = S.mode === "estudio" && S.revealed[q.id];

    let html = '<div class="card' + (revealed ? " revealed" : "") + '">';
    html += '<div class="q-topbar"><div><span class="pill">' + (S.idx + 1) + " / " + S.order.length + '</span><span class="pill">' + esc(q.dominio || "Transversal") + '</span><span class="pill">TS ' + esc(q.taskStatement) + '</span></div>';
    if (S.mode === "examen") html += '<div class="timer" id="timer">' + fmt(S.remaining) + "</div>";
    html += "</div>";
    if (q.escenario) html += '<div class="scenario">' + esc(q.escenario) + "</div>";
    html += "<p><strong>" + esc(q.enunciado) + "</strong></p>";
    S.optOrder[q.id].forEach(oid => {
      const o = q.opciones.find(x => x.id === oid);
      const chosen = sel.includes(oid);
      let cls = chosen ? " sel" : "";
      if (revealed) { if (o.correcta) cls = " ok"; else if (chosen) cls = " ko"; }
      html += '<label class="opt' + cls + '"><input type="' + type + '" name="opt" value="' + oid + '"' + (chosen ? " checked" : "") + (revealed ? " disabled" : "") + "><div>" + esc(o.texto) + '<div class="rationale"><strong>' + (o.correcta ? "✔" : "✘") + "</strong> " + esc(o.justificacion) + "</div></div></label>";
    });
    html += '<div class="actions">';
    if (S.mode === "estudio") {
      html += revealed
        ? '<button class="primary" id="next">' + (S.idx + 1 < S.order.length ? "Siguiente" : "Ver resultado") + "</button>"
        : '<button class="primary" id="check" ' + (sel.length ? "" : "disabled") + ">Comprobar</button>";
    } else {
      html += '<button id="prev" ' + (S.idx ? "" : "disabled") + ">← Anterior</button>";
      html += '<button id="nextq" ' + (S.idx + 1 < S.order.length ? "" : "disabled") + ">Siguiente →</button>";
      html += '<button id="flag">' + (S.flags.includes(q.id) ? "Desmarcar" : "Marcar 🚩") + "</button>";
      html += '<button class="primary" id="finish">Finalizar examen</button>';
    }
    html += "</div></div>";

    if (S.mode === "examen") {
      html += '<div class="card"><div class="navgrid">' + S.order.map((id, i) => {
        let c = [];
        if ((S.answers[id] || []).length) c.push("answered");
        if (S.flags.includes(id)) c.push("flagged");
        if (i === S.idx) c.push("current");
        return '<button data-i="' + i + '" class="' + c.join(" ") + '">' + (i + 1) + "</button>";
      }).join("") + '</div><div class="muted">Gris: respondida · Borde ámbar: marcada</div></div>';
    }
    app.innerHTML = html;

    app.querySelectorAll('input[name="opt"]').forEach(inp => inp.onchange = () => {
      let cur = S.answers[q.id] || [];
      if (multi) {
        cur = inp.checked ? cur.concat(inp.value) : cur.filter(v => v !== inp.value);
        if (cur.length > q.seleccionar) { inp.checked = false; cur = cur.filter(v => v !== inp.value); }
      } else cur = [inp.value];
      S.answers[q.id] = cur; save(); render();
    });
    const $ = id => document.getElementById(id);
    if ($("check")) $("check").onclick = () => { S.revealed[q.id] = true; save(); render(); };
    if ($("next")) $("next").onclick = () => { S.idx + 1 < S.order.length ? (S.idx++, save(), render()) : finishExam(); };
    if ($("prev")) $("prev").onclick = () => { S.idx--; save(); render(); };
    if ($("nextq")) $("nextq").onclick = () => { S.idx++; save(); render(); };
    if ($("flag")) $("flag").onclick = () => { S.flags.includes(q.id) ? S.flags = S.flags.filter(f => f !== q.id) : S.flags.push(q.id); save(); render(); };
    if ($("finish")) $("finish").onclick = () => { const un = S.order.filter(id => !(S.answers[id] || []).length).length; if (!un || confirm("Quedan " + un + " preguntas sin responder. ¿Finalizar igualmente?")) finishExam(); };
    app.querySelectorAll(".navgrid button").forEach(b => b.onclick = () => { S.idx = +b.dataset.i; save(); render(); });
    if ($("timer")) startTimer($("timer"));
  }

  function finishExam() { clearInterval(tick); S.finished = true; save(); results(); }

  function results() {
    clearInterval(tick);
    const total = S.order.length, hits = S.order.filter(id => isCorrect(byId(id))).length;
    const pct = hits / total, scaled = Math.round(100 + pct * 900);
    const dom = {};
    S.order.forEach(id => { const q = byId(id), d = q.dominio || "Transversal"; dom[d] = dom[d] || [0, 0]; dom[d][1]++; if (isCorrect(q)) dom[d][0]++; });
    let html = '<div class="card"><h2>' + (S.subset ? "Repaso de falladas" : "Resultado") + "</h2>";
    if (S.subset) {
      html += '<div class="big ' + (hits === total ? "ok-t" : "ko-t") + '">' + hits + " / " + total + "</div>";
      html += "<p>Repaso de " + total + " pregunta(s) que habías fallado. No cuenta como intento: la nota del bloque sigue siendo la de tu última vuelta completa.</p>";
    } else {
      html += '<div class="big ' + (scaled >= 720 ? "ok-t" : "ko-t") + '">' + scaled + ' <span class="muted" style="font-size:1rem">/ 1000 (orientativo·)</span></div>';
      html += "<p>" + hits + " de " + total + " correctas (" + Math.round(pct * 100) + "%). Corte real del examen: <strong>720</strong>.</p>";
      html += '<p class="muted">· Aproximación lineal: el examen real usa equating estadístico no público.</p>';
    }
    html += "<table><tr><th>Dominio</th><th>Aciertos</th><th>%</th></tr>" + Object.entries(dom).map(([d, v]) => "<tr><td>" + esc(d) + "</td><td>" + v[0] + "/" + v[1] + "</td><td>" + Math.round(v[0] / v[1] * 100) + "%</td></tr>").join("") + "</table>";
    const fallidas = S.order.filter(id => !isCorrect(byId(id)));
    html += '<div class="actions"><button class="primary" id="review">Revisar respuestas</button>';
    if (fallidas.length) {
      html += '<button id="repasar">Repetir solo las ' + fallidas.length + " fallada(s)</button>";
    }
    html += '<button id="restart">' + (S.subset ? "Volver al banco completo" : "Nuevo intento") + "</button></div></div>";
    app.innerHTML = html;
    document.getElementById("restart").onclick = () => { localStorage.removeItem(KEY); startScreen(); };
    document.getElementById("review").onclick = review;
    const rep = document.getElementById("repasar");
    if (rep) rep.onclick = () => init(S.mode, fallidas);
  }

  function review() {
    let html = "";
    S.order.forEach((id, i) => {
      const q = byId(id), ok = isCorrect(q), sel = S.answers[id] || [];
      html += '<div class="card revealed"><p><span class="pill">' + (i + 1) + '</span><span class="pill">' + esc(q.dominio || "Transversal") + " · TS " + esc(q.taskStatement) + '</span> <strong class="' + (ok ? "ok-t" : "ko-t") + '">' + (ok ? "Correcta" : "Incorrecta") + "</strong></p>";
      if (q.escenario) html += '<div class="scenario">' + esc(q.escenario) + "</div>";
      html += "<p><strong>" + esc(q.enunciado) + "</strong></p>";
      const leccion = leccionDe(q);
      if (leccion) html += '<p class="repasa">Repasa la <a href="' + leccion.href + '">' + esc(leccion.texto) + "</a></p>";
      q.opciones.forEach(o => {
        let cls = o.correcta ? " ok" : (sel.includes(o.id) ? " ko" : "");
        html += '<div class="opt' + cls + '"><div>' + o.id + ". " + esc(o.texto) + '<div class="rationale">' + esc(o.justificacion) + "</div></div></div>";
      });
      html += "</div>";
    });
    html += '<div class="card"><div class="actions"><button class="primary" id="back">Volver al resultado</button></div></div>';
    app.innerHTML = html;
    document.getElementById("back").onclick = results;
  }

  // ?continue=1 (funcionalidad "Continuar" del índice): si hay un intento sin
  // terminar, lo reanuda directamente en la siguiente pregunta sin responder
  // -- no necesariamente S.idx, que en modo examen puede quedar en cualquier
  // pregunta por la navegación libre/el marcado -- sin pasar por la portada.
  // Reutiliza el mismo S guardado y el mismo render() del botón "Reanudar
  // intento" existente, no duplica estado. Si no hay intento en curso, cae a
  // la portada normal (startScreen()).
  let continued = false;
  if (/[?&]continue=1/.test(location.search)) {
    const saved = load();
    if (saved && !saved.finished) {
      S = saved;
      const nextIdx = S.order.findIndex(id => !(S.answers[id] || []).length);
      if (nextIdx !== -1) S.idx = nextIdx;
      save();
      render();
      continued = true;
    }
  }
  if (!continued) startScreen();
})();
</script>
<script>
(function () {
  "use strict";
  var btn = document.createElement("button");
  btn.className = "toggle theme-toggle"; btn.type = "button";
  function cur() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
  function paint() {
    btn.textContent = cur() === "dark" ? "\u2600" : "\uD83C\uDF19";
    btn.title = cur() === "dark" ? "Cambiar a tema claro" : "Cambiar a tema oscuro";
  }
  btn.addEventListener("click", function () {
    var next = cur() === "dark" ? "light" : "dark";
    if (next === "dark") document.documentElement.dataset.theme = "dark";
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("ccarf-theme", next); } catch (e) {}
    paint();
  });
  paint(); document.getElementById("topbar-controls").appendChild(btn);
})();
</script>
<script>
(function () {
  "use strict";
  if (!document.documentElement.requestFullscreen) return;
  var btn = document.createElement("button");
  btn.className = "toggle fs-toggle"; btn.type = "button";
  function paint() {
    var fs = !!document.fullscreenElement;
    btn.textContent = fs ? "\u2921" : "\u2922";
    btn.title = fs ? "Salir de pantalla completa" : "Pantalla completa";
  }
  btn.addEventListener("click", function () {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen(); }
  });
  document.addEventListener("fullscreenchange", paint);
  paint(); document.getElementById("topbar-controls").appendChild(btn);
})();
</script>
</body>
</html>
