<style>
  /* =====================================================================
     DESIGN TOKENS — Volt
     ===================================================================== */
  :root{
    --font-sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;

    --fs-display:2.5rem; --fs-h1:2rem; --fs-h2:1.5rem; --fs-h3:1.25rem; --fs-h4:1.0625rem;
    --fs-body:1rem; --fs-sm:.875rem; --fs-caption:.75rem; --fs-code:.8125rem;

    --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-extra:800;

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

    --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px; --r-pill:999px;

    --shadow-sm:0 1px 2px rgba(12,27,44,.06);
    --shadow-md:0 4px 12px rgba(12,27,44,.08);

    --ease:150ms cubic-bezier(.4,0,.2,1);

    /* ---- Color · modo claro ---- */
    --bg:#FCFDFF; --surface:#FFFFFF; --surface-2:#F1F5FA;
    --border:#E1E9F1; --border-strong:#7E93AB;
    --text:#0E1B2C; --text-muted:#45536C; --text-subtle:#8496A8;

    --accent:#0E82FF; --accent-hover:#0A6BDB; --accent-active:#0857B4;
    --accent-weak:#E2F1FF; --accent-contrast:#06121F;
    --on-accent:#F7FBFF;

    /* --accent-text: texto acentuado (enlaces, eyebrows). --accent queda para rellenos/bordes/barras. */
    --accent-text:#0B69D4;
    /* --accent-btn: fondo de botones/CTAs de acento (.btn.primary). */
    --accent-btn:#0A6BDB; --accent-btn-hover:#0857B4;

    --success:#0E8546; --success-weak:#E2F6EA;
    --warning:#8F5D0B; --warning-weak:#FBEFD9;
    --danger:#CE4148;  --danger-weak:#FBE7E8;
    --info:#2E63FF;    --info-weak:#EAF0FF;
    color-scheme: light;
  }
  [data-theme="dark"]{
    /* ---- Color · modo oscuro ---- */
    --bg:#06101C; --surface:#101927; --surface-2:#172230;
    --border:#213244; --border-strong:#55708C;
    --text:#E4EDF6; --text-muted:#B6C5D9; --text-subtle:#66788C;

    --accent:#3FA9FF; --accent-hover:#63BBFF; --accent-active:#2C93F0;
    --accent-weak:#0E2C48; --accent-contrast:#06101C;
    --on-accent:#F7FBFF;

    --accent-text:#3FA9FF;
    --accent-btn:#0A6BDB; --accent-btn-hover:#0857B4;

    --success:#37DA84; --success-weak:#123526;
    --warning:#F0A93C; --warning-weak:#33260F;
    --danger:#F0656C;  --danger-weak:#3A1A1C;
    --info:#6684FF;    --info-weak:#17223F;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 18px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  /* =====================================================================
     BASE
     ===================================================================== */
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.55;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
    transition:background var(--ease),color var(--ease);}
  h1{margin:0;line-height:1.1;}
  a{color:var(--accent-text);font-weight:var(--fw-medium);text-decoration:none;}
  a:hover{text-decoration:underline;}
  code{font-family:var(--font-mono);font-size:.95em;background:var(--surface-2);color:var(--text);
    border:1px solid var(--border);border-radius:var(--r-sm);padding:1px 6px;overflow-wrap:anywhere;}
  :is(a,button,input,select):focus-visible,.tarjeta[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* =====================================================================
     TOPBAR
     ===================================================================== */
  .topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    gap:var(--sp-4);padding:14px 24px;flex-wrap:nowrap;background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:var(--fw-bold);letter-spacing:-.01em;min-width:0;overflow:hidden;color:var(--text);text-decoration:none;}
  .topbar .brand:hover{text-decoration:none;color:var(--accent-text);}
  a.home-link{display:inline-flex;align-items:center;text-decoration:none;}
  a.home-link:hover{text-decoration:none;}
  .dot{width:20px;height:20px;border-radius:6px;background:var(--accent);flex:none;}
  .brand-full{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .brand-sigla{font-family:var(--font-mono);font-size:var(--fs-caption);font-weight:var(--fw-medium);color:var(--text-muted);flex:0 0 auto;}
  .topbar .controles-top{display:flex;gap:8px;align-items:center;flex:0 0 auto;}
  .toggle{cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
    padding:8px 13px;border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:var(--fw-medium);
    font-family:inherit;transition:border-color var(--ease),color var(--ease);}
  .toggle:hover{border-color:var(--accent);color:var(--accent);}
  @media (max-width:420px){ .brand-full{display:none;} }

  /* =====================================================================
     LAYOUT / HERO
     ===================================================================== */
  .wrap{max-width:960px;margin:0 auto;padding:var(--sp-6) 24px 90px;}
  .hero{padding-bottom:var(--sp-6);}
  .eyebrow{font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--accent-text);
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-2);}
  .display{font-size:var(--fs-display);font-weight:var(--fw-extra);letter-spacing:-.03em;
    line-height:1.05;margin:0 0 var(--sp-4);}
  /* Badges / chips — peso medium, nunca semibold/bold */
  .badge{font-size:var(--fs-caption);font-weight:var(--fw-medium);padding:4px 11px;border-radius:var(--r-pill);
    white-space:nowrap;}
  .badge.neutral{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);}
  .badge.accent{background:var(--accent-weak);color:var(--accent-text);}
  .badge.neutral.dif-facil{color:var(--success);} .badge.neutral.dif-media{color:var(--warning);} .badge.neutral.dif-dificil{color:var(--danger);}

  /* =====================================================================
     TARJETAS / PANELES
     ===================================================================== */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:var(--sp-5);box-shadow:var(--shadow-sm);}

  section.panel{margin-bottom:var(--sp-6);}

  /* Resumen Leitner: fila de estadisticas, sin marcos individuales */
  .stats-row{display:flex;flex-wrap:wrap;gap:var(--sp-5);}
  .stat{flex:1 1 140px;padding-left:var(--sp-4);border-left:2px solid var(--border);}
  .stat:first-child{padding-left:0;border-left:none;}
  .stat b{display:block;font-size:1.5rem;font-weight:var(--fw-extra);line-height:1.2;}
  .stat span{font-size:var(--fs-caption);color:var(--text-muted);}
  .stat.c1 b{color:var(--danger);} .stat.c2 b{color:var(--warning);} .stat.c3 b{color:var(--success);}

  .divisor{border:none;border-top:1px solid var(--border);margin:var(--sp-5) 0;}

  /* Controles de sesion */
  .controles{display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:end;}
  .field-inline{display:flex;flex-direction:column;gap:6px;}
  .field-inline label{font-size:var(--fs-caption);font-weight:var(--fw-medium);color:var(--text-muted);}
  .field-inline select{font-family:inherit;font-size:var(--fs-sm);padding:9px 12px;border-radius:var(--r-md);
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;
    transition:border-color var(--ease);}
  .field-inline select:hover,.field-inline select:focus{border-color:var(--accent);}

  /* CTA principal de pantalla (Empezar sesion / Otra sesion): un punto mayor que el resto de botones de accion. */
  .btn{font-family:inherit;font-size:var(--fs-sm);font-weight:var(--fw-semibold);border-radius:var(--r-md);
    padding:8px 14px;border:1px solid transparent;cursor:pointer;transition:background var(--ease),border-color var(--ease),color var(--ease);}
  .btn.primary{background:var(--accent-btn);color:var(--on-accent);}
  .btn.primary:hover{background:var(--accent-btn-hover);}
  .btn.primary:active{background:var(--accent-active);}
  .btn.ghost{background:none;color:var(--text-muted);border:none;text-decoration:underline;cursor:pointer;
    font-family:inherit;font-size:var(--fs-caption);padding:0;}
  .btn.ghost:hover{color:var(--accent);}

  /* =====================================================================
     SESION DE ESTUDIO
     ===================================================================== */
  .progreso-sesion{font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:var(--sp-2);}
  .barra{height:8px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);
    overflow:hidden;margin-bottom:var(--sp-5);}
  .barra>div{height:100%;background:var(--accent);width:0;transition:width .3s;}

  /* Tarjeta — protagonista, centrada, sin degradados */
  .escena{max-width:720px;margin:0 auto var(--sp-4);perspective:1400px;}
  .tarjeta{position:relative;width:100%;min-height:340px;cursor:pointer;
    transform-style:preserve-3d;transition:transform .45s;}
  .tarjeta.girada{transform:rotateY(180deg);}
  .cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:1px solid var(--border);border-radius:var(--r-xl);background:var(--surface);
    padding:36px 40px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);}
  .cara.dorso{transform:rotateY(180deg);}
  .cara .etq-cara{font-family:var(--font-mono);font-size:var(--fs-caption);letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);margin-bottom:var(--sp-4);}
  .cara .texto{flex:1;display:flex;align-items:center;font-size:1.25rem;text-align:center;}
  .cara .texto>div{width:100%;}
  .cara .pie-carta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:var(--sp-4);}
  .cara .texto code{font-size:.85em;}
  .dif-facil{color:var(--success);} .dif-media{color:var(--warning);} .dif-dificil{color:var(--danger);}

  .pista{text-align:center;color:var(--text-muted);font-size:var(--fs-caption);margin:0 0 var(--sp-5);}

  /* Valoracion */
  .valorar{display:none;gap:var(--sp-3);flex-wrap:wrap;max-width:720px;margin:0 auto;}
  .valorar.visible{display:flex;}
  .valorar button{flex:1 1 150px;border-radius:var(--r-lg);border:1px solid var(--border);border-top:3px solid var(--border);
    padding:6px 12px;font-family:inherit;font-size:var(--fs-caption);cursor:pointer;background:var(--surface);
    color:var(--text);transition:border-color var(--ease),background var(--ease);}
  .valorar button:hover{background:var(--surface-2);}
  .valorar .v1{border-top-color:var(--danger);} .valorar .v1 b{color:var(--danger);}
  .valorar .v2{border-top-color:var(--warning);} .valorar .v2 b{color:var(--warning);}
  .valorar .v3{border-top-color:var(--success);} .valorar .v3 b{color:var(--success);}
  .valorar b{font-weight:var(--fw-semibold);}
  .valorar small{display:block;color:var(--text-muted);}

  /* Fin de sesion */
  .fin{display:none;text-align:center;max-width:640px;margin:0 auto;}
  .fin h2{color:var(--text);margin:0 0 var(--sp-2);font-size:var(--fs-h3);font-weight:var(--fw-bold);}
  .fin p{color:var(--text-muted);margin-bottom:var(--sp-4);}

  footer{margin-top:var(--sp-6);padding-top:var(--sp-3);border-top:1px solid var(--border);
    font-size:var(--fs-caption);color:var(--text-muted);display:flex;justify-content:space-between;
    flex-wrap:wrap;gap:8px;}

  @media (max-width:600px){
    .cara{padding:24px;}
    .cara .texto{font-size:1.05rem;}
    .stats-row{gap:var(--sp-4);}
    .stat{flex:1 1 100px;}
  }
  @media (pointer:coarse){
    .btn, .toggle, .valorar button { min-height:44px; }
  }
</style>

// ===================== DATA =====================
const MAZO =
// __MAZO_JSON_START__
{"config":{"bloque":0,"nombre":"Fundamentos: API de Claude, tool use y bucle agéntico","version":"1.0","fecha":"2026-08-05","guiaOficialExamen":"1.0","generadoDesdeCorpus":"bloque-0-fundamentos.md v1.0"},"cartas":[{"id":"b0-fc01","taskStatement":"0.1","front":"Is the Messages API stateless or stateful? What is the implication for agentic loops?","back":"The Messages API is completely stateless; the server remembers nothing between calls. The client must reconstruct and send the complete context in each request, including all previous messages. This is why agentic loops work by appending each turn to a local array and resending the full history.","refSeccion":"#ts-0-1","dificultad":"facil","etiquetas":["messages-api","stateless","architecture"]},{"id":"b0-fc02","taskStatement":"0.1","front":"Where should the `system` parameter be placed in a Messages API request?","back":"The `system` parameter must be a top-level parameter in the request, never as a message with `role: \"system\"` inside the `messages` array. Exception: Claude Opus 5, Opus 4.8, Fable 5, and Mythos 5 support mid-conversation system messages (always after a user turn).","refSeccion":"#ts-0-1","dificultad":"facil","etiquetas":["system-prompt","messages-api","request-structure"]},{"id":"b0-fc03","taskStatement":"0.1","front":"What does `max_tokens` limit in a Messages API response, and what happens when it is exhausted?","back":"`max_tokens` limits only the output token budget (not total context). If generation exhausts it mid-response, the response is truncated at the word boundary and `stop_reason` becomes `\"max_tokens\"`. The client must then increase `max_tokens` and retry, or accept the partial response.","refSeccion":"#ts-0-1","dificultad":"media","etiquetas":["max-tokens","stop-reason","truncation"]},{"id":"b0-fc04","taskStatement":"0.1","front":"Which content blocks can appear in the `content` array of a Messages API response from Claude?","back":"Only `text` and `tool_use` blocks can appear in the model's response. The blocks `tool_result` (and images/documents within them) belong to user messages constructed by the client, never to the assistant response.","refSeccion":"#ts-0-1","dificultad":"media","etiquetas":["content-blocks","response-structure","tool-use"]},{"id":"b0-fc05","taskStatement":"0.1","front":"What is the anti-pattern of treating `system` as a message inside the `messages` array, and why does it fail?","back":"Passing `{\"role\": \"system\", \"content\": \"...\"}` inside the array produces an error or undefined behavior because `system` is not a valid role in the messages array (except in the few models that support mid-conversation system messages). The correct pattern is to pass `system` as a top-level request parameter.","refSeccion":"#ts-0-1","dificultad":"dificil","etiquetas":["anti-pattern","system-prompt","messages-api"]},{"id":"b0-fc06","taskStatement":"0.2","front":"What are the three required fields to define a tool in the Claude API?","back":"`name` (regex `^[a-zA-Z0-9_-]{1,64}$`), `description` (minimum 3–4 sentences of plain text), and `input_schema` (a JSON Schema object with `type: \"object\"`, `properties`, and `required` fields).","refSeccion":"#ts-0-2","dificultad":"facil","etiquetas":["tool-definition","schema","structure"]},{"id":"b0-fc07","taskStatement":"0.2","front":"Why is the tool `description` field critical for tool invocation reliability?","back":"The description is the only mechanism the model has to decide when and how to invoke a tool. Its quality—clarity about what the tool does, when to use it, and its limitations—directly determines whether the model selects the tool correctly or misroutes the call.","refSeccion":"#ts-0-2","dificultad":"facil","etiquetas":["tool-description","design","reliability"]},{"id":"b0-fc08","taskStatement":"0.2","front":"What is `input_examples` and what are its cost and limitations?","back":"`input_examples` is an optional array of valid schema instances that help the model understand parameters, formats, and patterns. Cost: ~20–50 tokens per simple example, ~100–200 for complex ones. Limitation: NOT supported in server-side tools.","refSeccion":"#ts-0-2","dificultad":"media","etiquetas":["input-examples","cost","server-tools"]},{"id":"b0-fc09","taskStatement":"0.2","front":"What does `strict: true` guarantee in a tool definition, and with which `tool_choice` values does it work?","back":"`strict: true` guarantees via grammar-constrained sampling that every tool call matches the schema exactly—no missing required parameters or type mismatches. This guarantee applies regardless of `tool_choice` value: `\"auto\"`, `\"any\"`, forced tool, or `\"none\"`.","refSeccion":"#ts-0-2","dificultad":"media","etiquetas":["strict-mode","schema-validation","tool-choice"]},{"id":"b0-fc10","taskStatement":"0.2","front":"What anti-pattern occurs when tool descriptions are ambiguous or overlapping, and how does it manifest?","back":"Ambiguous descriptions (e.g., 'lookup_data' without specifying whether to search by ID, name, or email) force the model to guess the correct invocation, resulting in misrouting and incorrect tool calls. The solution is explicit boundaries: what each tool accepts, when to choose one over another, and caveats.","refSeccion":"#ts-0-2","dificultad":"dificil","etiquetas":["anti-pattern","description","misrouting"]},{"id":"b0-fc11","taskStatement":"0.3","front":"What three fields does a `tool_use` content block contain?","back":"`type: \"tool_use\"`, `id` (unique identifier for that specific call), `name` (tool name), and `input` (JSON object matching the tool's `input_schema`).","refSeccion":"#ts-0-3","dificultad":"facil","etiquetas":["tool-use","content-blocks","structure"]},{"id":"b0-fc12","taskStatement":"0.3","front":"What must the `tool_use_id` field in a `tool_result` block exactly match?","back":"The `tool_use_id` must match exactly the `id` field from the corresponding `tool_use` block. This is how the API maps results back to their originating tool calls.","refSeccion":"#ts-0-3","dificultad":"media","etiquetas":["tool-result","tool-use-id","mapping"]},{"id":"b0-fc13","taskStatement":"0.3","front":"What is the correct order of content blocks in a user message containing `tool_result`, and what error occurs if reversed?","back":"`tool_result` blocks must come FIRST in the content array, followed by any additional text. Putting text before `tool_result` causes a 400 API error. This strict ordering is non-negotiable.","refSeccion":"#ts-0-3","dificultad":"media","etiquetas":["tool-result","content-order","error"]},{"id":"b0-fc14","taskStatement":"0.3","front":"What is the fundamental difference between client tools and server tools regarding `tool_result` responsibility?","back":"Client tools: the client executes the tool and returns `tool_result` manually. Server tools (`web_search`, `code_execution`, etc.): Anthropic executes them internally. Sending manual `tool_result` for a server tool produces undefined behavior.","refSeccion":"#ts-0-3","dificultad":"media","etiquetas":["client-tools","server-tools","execution"]},{"id":"b0-fc15","taskStatement":"0.3","front":"How should error messages in `tool_result` (with `is_error: true`) be structured to enable intelligent model recovery?","back":"Error messages must be descriptive and instructive—e.g., 'Rate limit exceeded. Retry after 60 seconds' or 'Missing required location parameter'—not generic like 'Operation failed.' This allows the model to decide whether to retry, use a fallback, or escalate.","refSeccion":"#ts-0-3","dificultad":"dificil","etiquetas":["error-handling","tool-result","messaging"]},{"id":"b0-fc16","taskStatement":"0.4","front":"List the seven possible values of `stop_reason` in a Messages API response.","back":"`\"end_turn\"` (completed normally), `\"tool_use\"` (tool call requested), `\"max_tokens\"` (output budget exhausted), `\"stop_sequence\"` (custom stop sequence triggered), `\"pause_turn\"` (server tool iteration limit reached), `\"refusal\"` (policy rejection), `\"model_context_window_exceeded\"` (context window full).","refSeccion":"#ts-0-4","dificultad":"facil","etiquetas":["stop-reason","values","enumeration"]},{"id":"b0-fc17","taskStatement":"0.4","front":"What should happen in an agentic loop when `stop_reason == \"tool_use\"`?","back":"Execute all `tool_use` blocks (in parallel if multiple), collect results, construct a `tool_result` for each, and send a new request with those results appended to the message history. The loop continues because the tool call was received.","refSeccion":"#ts-0-4","dificultad":"media","etiquetas":["tool-use","loop-control","flow"]},{"id":"b0-fc18","taskStatement":"0.4","front":"What action should the client take when `stop_reason == \"max_tokens\"`?","back":"The response is truncated (possibly mid-word). The client has two options: (1) increase `max_tokens` and retry the same request, or (2) accept the partial response and present it to the user with a warning that it's incomplete.","refSeccion":"#ts-0-4","dificultad":"media","etiquetas":["max-tokens","truncation","handling"]},{"id":"b0-fc19","taskStatement":"0.4","front":"Why is confusing `pause_turn` with `end_turn` especially dangerous in an agentic loop?","back":"If a `pause_turn` response (server tools still executing internally) is returned to the user as final, the server tool work remains incomplete and the result is misleading. `pause_turn` is NOT terminal; the client must resend the assistant message without `tool_result` so the model can continue.","refSeccion":"#ts-0-4","dificultad":"dificil","etiquetas":["pause-turn","end-turn","server-tools"]},{"id":"b0-fc20","taskStatement":"0.4","front":"What does `stop_reason == \"pause_turn\"` indicate, and how should the client respond?","back":"`pause_turn` indicates server tools are still running (the internal iteration limit was reached). The client should resend the assistant message with any collected `server_tool_use` results so the model can continue iterating where it paused.","refSeccion":"#ts-0-4","dificultad":"media","etiquetas":["pause-turn","server-tools","iteration"]},{"id":"b0-fc21","taskStatement":"0.4","front":"What is the canonical control logic for deciding whether an agentic loop should continue or exit?","back":"The loop continues while `stop_reason == \"tool_use\"`; it exits on any other value. Each exit value requires an explicit action: `\"end_turn\"` (return result), `\"max_tokens\"` (truncate or retry), `\"refusal\"` (apply fallback/escalate), `\"pause_turn\"` (resend to continue), etc.","refSeccion":"#ts-0-4","dificultad":"dificil","etiquetas":["loop-control","stop-reason","logic"]},{"id":"b0-fc22","taskStatement":"0.5","front":"What is the difference between `tool_choice: \"auto\"` and `tool_choice: \"any\"`?","back":"`\"auto\"` (default): the model decides whether to call a tool at all—it will respond with text alone if that's more appropriate. `\"any\"`: the model MUST call some tool, but chooses which one.","refSeccion":"#ts-0-5","dificultad":"facil","etiquetas":["tool-choice","auto","any"]},{"id":"b0-fc23","taskStatement":"0.5","front":"What does 'prefill' mean in the context of `tool_choice: \"any\"` or tool-forced?","back":"The API automatically prefills the assistant message, suppressing any explanatory text before the `tool_use` block. This means Claude will not emit text like 'I'll check the weather' before the tool call—the prefill enforces the structure.","refSeccion":"#ts-0-5","dificultad":"media","etiquetas":["prefill","tool-choice","behavior"]},{"id":"b0-fc24","taskStatement":"0.5","front":"What is the combined guarantee when using `tool_choice: \"any\"` + `strict: true` together?","back":"The combined guarantee ensures that a tool WILL be called (`\"any\"` forces the call) AND the input WILL conform exactly to the schema (`strict: true` prevents invalid parameters). This is a compound guarantee: call + conformity.","refSeccion":"#ts-0-5","dificultad":"media","etiquetas":["tool-choice","strict","guarantee"]},{"id":"b0-fc25","taskStatement":"0.5","front":"Which `tool_choice` values are compatible with extended thinking manual (`thinking: {type: \"enabled\"}` )?","back":"Only `\"auto\"` and `\"none\"` are compatible with manual extended thinking. `\"any\"` and tool-forced are NOT compatible. (Note: adaptive thinking, which is the default in some models, does support `\"any\"` and tool-forced.)","refSeccion":"#ts-0-5","dificultad":"dificil","etiquetas":["extended-thinking","tool-choice","compatibility"]},{"id":"b0-fc26","taskStatement":"0.5","front":"When should `tool_choice: \"none\"` be used?","back":"`\"none\"` is used for pure QA mode where side effects are not allowed—no tool calls are permitted, only text responses. It is the default behavior when no tools are defined in the request.","refSeccion":"#ts-0-5","dificultad":"media","etiquetas":["tool-choice","none","qa-mode"]},{"id":"b0-fc27","taskStatement":"0.6","front":"What is the fundamental distinction between model-driven decision-making and deterministic workflows in agent design?","back":"Model-driven (agentic): the model decides which tools to call and in what order based on context (flexible, adaptive to new data). Deterministic (workflow): the sequence is fixed in advance—'always A, then B, then C'—with no adaptation, suitable for critical operations.","refSeccion":"#ts-0-6","dificultad":"media","etiquetas":["agent","workflow","architecture"]},{"id":"b0-fc28","taskStatement":"0.6","front":"Why is prompt-only guidance insufficient for critical operations like refunds, and what should be used instead?","back":"Prompt-only guidance fails in practice (~12% failure rate documented in the official exam guide) because the model can ignore instructions if it generates a plausible alternative reasoning. The solution is a programmatic gate or hook that enforces the rule independent of model reasoning.","refSeccion":"#ts-0-6","dificultad":"dificil","etiquetas":["enforcement","hook","anti-pattern"]},{"id":"b0-fc29","taskStatement":"0.6","front":"In an agentic loop, when should tool choice be forced for a specific tool, and when should it revert to `\"auto\"`?","back":"Force a tool for the first step of critical sequences (e.g., always verify customer before processing refund). After that critical step, revert to `\"auto\"` for non-critical subsequent steps to preserve flexibility and allow the model to adapt.","refSeccion":"#ts-0-6","dificultad":"media","etiquetas":["tool-choice","sequencing","critical-step"]},{"id":"b0-fc30","taskStatement":"0-decision","front":"When do you use `tool_choice: \"any\"` + `strict: true`, and what problem does this combination solve?","back":"Use this combination when you need guaranteed structured output validated by a schema. The prefill from `\"any\"` forces a tool call; `strict: true` ensures the input conforms exactly. This solves the problem of enforcing consistent output structure in extraction or classification tasks.","refSeccion":"#ts-0-decision","dificultad":"media","etiquetas":["decision-table","tool-choice","strict"]},{"id":"b0-fc31","taskStatement":"0-decision","front":"When should you use a deterministic workflow (programmed sequence) instead of an agentic loop, and what enforcement mechanism is required?","back":"Use a deterministic workflow for critical operations (compliance, money transfers) where failure is not an option. The enforcement mechanism must be programmatic—hooks, gates, or pre-configured sequences—not prompt-only guidance, because text-based rules fail ~12% of the time in practice.","refSeccion":"#ts-0-decision","dificultad":"dificil","etiquetas":["decision-table","workflow","enforcement"]}]}

;
// ================================================

const CFG = MAZO.config;
const CARTAS = MAZO.cartas;
const KEY = `ccarf-fc-b${CFG.bloque}-v${CFG.version}`;
const KEY_TEMA = "ccarf-theme";

// ---------- utilidades ----------
const $ = id => document.getElementById(id);
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(s){ // solo `inline code`
  return escapeHtml(s).replace(/`([^`]+)`/g, "<code>$1</code>");
}
function barajar(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

// ---------- estado Leitner ----------
function cargarEstado(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function guardarEstado(e){ localStorage.setItem(KEY, JSON.stringify(e)); }
let estado = cargarEstado(); // { cardId: {box:1|2|3, vistas:n, ultima:iso} }
function cajaDe(id){ return (estado[id] && estado[id].box) || 1; }

// ---------- tema ----------
function aplicarTema(t){ document.documentElement.setAttribute("data-theme", t); localStorage.setItem(KEY_TEMA, t); }
aplicarTema(localStorage.getItem(KEY_TEMA) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light"));
$("btnTema").onclick = () => aplicarTema(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");

// ---------- cabecera ----------
document.title = `Flashcards CCAR-F · Bloque ${CFG.bloque} — ${CFG.nombre}`;
$("eyebrowBloque").textContent = `CCAR-F · Bloque ${CFG.bloque}`;
$("titulo").textContent = `Flashcards: ${CFG.nombre}`;
$("pieMeta").textContent = `Generado desde ${CFG.generadoDesdeCorpus} · el progreso vive en este navegador (localStorage)`;

// ---------- filtros ----------
const etiquetas = [...new Set(CARTAS.flatMap(c=>c.etiquetas))].sort();
for(const e of etiquetas){ const o=document.createElement("option"); o.value=e; o.textContent=e; $("selEtiqueta").appendChild(o); }

function refrescarCajas(){
  const n={1:0,2:0,3:0};
  for(const c of CARTAS) n[cajaDe(c.id)]++;
  $("nCaja1").textContent=n[1]; $("nCaja2").textContent=n[2]; $("nCaja3").textContent=n[3];
}
refrescarCajas();

// ---------- sesion ----------
let cola=[], idx=0, resultados={1:0,2:0,3:0};

function construirCola(){
  const modo=$("selModo").value, etq=$("selEtiqueta").value;
  let base = CARTAS.filter(c => !etq || c.etiquetas.includes(etq));
  if(modo==="caja1")  base = base.filter(c=>cajaDe(c.id)===1);
  if(modo==="caja12") base = base.filter(c=>cajaDe(c.id)<=2);
  if(modo==="repaso"){
    const g={1:[],2:[],3:[]};
    for(const c of base) g[cajaDe(c.id)].push(c);
    return [...barajar(g[1]), ...barajar(g[2]), ...barajar(g[3])];
  }
  return barajar(base);
}

function pintarCarta(){
  const c = cola[idx];
  $("posSesion").textContent = `Carta ${idx+1} de ${cola.length} · caja actual: ${cajaDe(c.id)}`;
  $("barraSesion").style.width = `${Math.round(idx/cola.length*100)}%`;
  $("txtFrente").innerHTML = md(c.front);
  $("txtDorso").innerHTML  = md(c.back);
  const pie = `<span class="badge neutral">TS ${escapeHtml(c.taskStatement)}</span>
               <span class="badge neutral dif-${c.dificultad}">${c.dificultad}</span>
               ${c.etiquetas.map(e=>`<span class="badge neutral">${escapeHtml(e)}</span>`).join("")}
               <span class="badge neutral" title="Sección del corpus que respalda la carta">corpus ${escapeHtml(c.refSeccion)}</span>`;
  $("pieFrente").innerHTML = pie; $("pieDorso").innerHTML = pie;
  $("tarjeta").classList.remove("girada");
  $("valorar").classList.remove("visible");
  $("pistaGiro").style.display="";
}

function empezar(){
  cola = construirCola(); idx=0; resultados={1:0,2:0,3:0};
  if(!cola.length){ alert("No hay cartas que casen con ese filtro."); return; }
  $("fin").style.display="none"; $("zonaEstudio").style.display=""; pintarCarta();
}
$("btnEmpezar").onclick = empezar;
$("btnOtra").onclick = () => { $("fin").style.display="none"; refrescarCajas(); empezar(); };

function girar(){
  const t=$("tarjeta");
  t.classList.toggle("girada");
  const girada = t.classList.contains("girada");
  $("valorar").classList.toggle("visible", girada);
  $("pistaGiro").style.display = girada ? "none" : "";
}
$("tarjeta").addEventListener("click", girar);
$("tarjeta").addEventListener("keydown", e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); girar(); } });

function valorar(v){
  const c = cola[idx];
  const actual = cajaDe(c.id);
  let nueva;
  if(v===1) nueva = 1;
  else if(v===2) nueva = Math.min(actual,2)===1 ? 2 : 2; // desde 1 sube a 2; desde 2/3 queda/baja a 2
  else nueva = Math.min(3, actual+1);
  estado[c.id] = { box:nueva, vistas:((estado[c.id]&&estado[c.id].vistas)||0)+1, ultima:new Date().toISOString().slice(0,10) };
  guardarEstado(estado);
  resultados[v]++;
  idx++;
  if(idx >= cola.length){ terminar(); } else { pintarCarta(); }
}
document.querySelectorAll("#valorar button").forEach(b => b.onclick = () => valorar(+b.dataset.v));

document.addEventListener("keydown", e=>{
  if($("zonaEstudio").style.display==="none") return;
  if(e.key===" " && document.activeElement.tagName!=="BUTTON"){ e.preventDefault(); girar(); return; }
  if($("valorar").classList.contains("visible") && ["1","2","3"].includes(e.key)) valorar(+e.key);
});

function terminar(){
  $("zonaEstudio").style.display="none";
  refrescarCajas();
  $("resumenFin").innerHTML = `Has repasado <b>${cola.length}</b> cartas: `+
    `<b class="dif-dificil">${resultados[1]}</b> falladas · <b class="dif-media">${resultados[2]}</b> dudosas · <b class="dif-facil">${resultados[3]}</b> sabidas.`+
    `<br>Cajas ahora: ${$("nCaja1").textContent} / ${$("nCaja2").textContent} / ${$("nCaja3").textContent}. La caja 1 es tu prioridad del próximo repaso.`;
  $("barraSesion").style.width="100%";
  $("fin").style.display="";
}

$("btnReset").onclick = ()=>{
  if(confirm("¿Borrar el progreso de estas flashcards en este navegador?")){
    localStorage.removeItem(KEY); estado={}; refrescarCajas();
    $("zonaEstudio").style.display="none"; $("fin").style.display="none";
  }
};
</script>
</body>
</html>
