<!--
  PLANTILLA DE GUÍA INTERACTIVA — sistema de diseño Volt (plantillas/volt-style-guide.html).
  INSTRUCCIONES DE GENERACIÓN:
  1. Sustituir {{TITULO}}, {{SUBTITULO}}.
  2. Sustituir el bloque delimitado por los marcadores de comentario __CONTENIDO__ ...
     __FIN_CONTENIDO__ (sin escribir aquí su sintaxis literal: un comentario anidado
     cerraría este bloque de instrucciones y filtraría el resto al DOM) por el HTML
     de la guía (conversión del markdown): h2/h3 con id (anchors), p, pre>code, table, ul/ol.
     - Fences mermaid  ->  pre con clase "mermaid" (tema corporativo ya inicializado en el JS).
     - Fences de código -> pre con atributo data-lang="<lenguaje del fence>" (etiqueta visual
                           en la esquina del bloque; sin data-lang no se pinta etiqueta).
     - Referencias oficiales al cierre de cada lección -> p con clase "doc-link".
     - Mini-checks     ->  div.minicheck con data-correct, labels+inputs, button.mc-check,
                           div.mc-feedback con data-explica (mismo markup que la plantilla base).
     - Variantes de lenguaje (opcional): un mismo ejemplo en dos lenguajes se envuelve en
                           div.lang-variant con data-lang="python" y data-lang="typescript",
                           un div por variante y en ese orden, cada uno conteniendo su pre>code.
                           En el markdown fuente el par va entre los comentarios
                           variantes:inicio / variantes:fin, con un fence por lenguaje.
                           El botón de cambio solo se renderiza si la página trae variantes,
                           el defecto es TypeScript (localStorage "ccarf-lang") y al imprimir
                           se fuerza TypeScript por CSS, porque el PDF no tiene toggle.
  3. PDF: abrir con ?print=1 (revela respuestas) y usar herramientas/html-a-pdf.ps1.
  4. El TOC (sidebar izquierda sticky) se genera solo a partir de los h2/h3 de #contenido.
  Reglas de diseño aplicadas: tokens Volt en :root/[data-theme="dark"], Plus Jakarta Sans
  (texto) + JetBrains Mono (código) vía Google Fonts, escala tipográfica y espaciado en
  base 4px, radios contenidos, sombras mínimas (el peso visual recae en el borde de 1px),
  un único acento, contraste AA en ambos temas, movimiento solo fade 150-250ms con
  prefers-reduced-motion respetado.
-->
<script>try{if(localStorage.getItem("ccarf-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<script>try{var l=localStorage.getItem("ccarf-lang");document.documentElement.dataset.lang=(l==="python")?"python":"typescript"}catch(e){document.documentElement.dataset.lang="typescript"}</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  /* Design tokens · Volt (copiados de plantillas/volt-style-guide.html) */
  :root {
    --font-sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;

    --fs-display:2.5rem; --fs-h1:2rem; --fs-h2:1.5rem; --fs-h3:1.25rem;
    --fs-body:1rem; --fs-sm:.875rem; --fs-caption:.75rem; --fs-code:.8125rem;

    --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-extra:800;

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

    --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px; --r-pill:999px;

    --shadow-sm:0 1px 2px rgba(12,27,44,.06);
    --shadow-md:0 4px 12px rgba(12,27,44,.08);

    --ease:150ms cubic-bezier(.4,0,.2,1);

    --bg:#FCFDFF; --surface:#FFFFFF; --surface-2:#F1F5FA;
    --border:#E1E9F1; --border-strong:#7E93AB;
    --text:#0E1B2C; --text-muted:#45536C; --text-subtle:#8496A8;

    --accent:#0E82FF; --accent-hover:#0A6BDB; --accent-active:#0857B4;
    --accent-weak:#E2F1FF; --accent-contrast:#06121F; --on-accent:#F7FBFF;
    --accent-text:#0B69D4;
    --accent-btn:#0A6BDB; --accent-btn-hover:#0857B4;

    --success:#0E8546; --success-weak:#E2F6EA;
    --warning:#8F5D0B; --warning-weak:#FBEFD9;
    --danger:#CE4148;  --danger-weak:#FBE7E8;
    --info:#2E63FF;    --info-weak:#EAF0FF;

    color-scheme:light;
  }
  [data-theme="dark"] {
    --bg:#06101C; --surface:#101927; --surface-2:#172230;
    --border:#213244; --border-strong:#55708C;
    --text:#E4EDF6; --text-muted:#B6C5D9; --text-subtle:#66788C;

    --accent:#3FA9FF; --accent-hover:#63BBFF; --accent-active:#2C93F0;
    --accent-weak:#0E2C48; --accent-contrast:#06101C;
    --accent-text:#3FA9FF;

    --success:#37DA84; --success-weak:#123526;
    --warning:#F0A93C; --warning-weak:#33260F;
    --danger:#F0656C;  --danger-weak:#3A1A1C;
    --info:#6684FF;    --info-weak:#17223F;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 18px rgba(0,0,0,.4);

    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font-sans); font-size:var(--fs-body); line-height:1.6; font-weight:var(--fw-regular); color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; }
  /* Topbar sticky — marca a la izquierda, controles (tema/idioma/pantalla completa) a la derecha. */
  .topbar { position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center;
    gap:var(--sp-4); padding:14px 24px; background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
  .topbar .brand { display:flex; align-items:center; gap:10px; font-weight:var(--fw-bold); letter-spacing:-.01em; color:var(--text); text-decoration:none; }
  .topbar .brand:hover { text-decoration:none; color:var(--accent-text); }
  a.home-link { display:inline-flex; align-items:center; text-decoration:none; }
  a.home-link:hover { text-decoration:none; }
  .dot { width:20px; height:20px; border-radius:6px; background:var(--accent); flex:0 0 auto; }
  .brand-sigla { font-family:var(--font-mono); font-size:var(--fs-caption); font-weight:var(--fw-medium); color:var(--text-muted); }
  .topbar-controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .toggle, .theme-toggle, .fs-toggle, .lang-toggle { cursor:pointer; border:1px solid var(--border-strong); background:var(--surface);
    color:var(--text); padding:8px 13px; border-radius:var(--r-md); font-size:var(--fs-sm); font-weight:var(--fw-semibold);
    font-family:inherit; line-height:1.2; transition:border-color var(--ease), color var(--ease); }
  .toggle:hover, .theme-toggle:hover, .fs-toggle:hover, .lang-toggle:hover { border-color:var(--accent); color:var(--accent-text); }
  @media (pointer:coarse) {
    .toggle, .theme-toggle, .fs-toggle, .lang-toggle, .minicheck button { min-height:44px; }
  }

  /* Layout de dos columnas — patrón Volt (topbar + hero de ancho completo; debajo, sidebar de TOC + contenido). */
  .wrap { max-width:1240px; margin:0 auto; padding:48px 24px 90px; }

  .eyebrow { font-family:var(--font-mono); font-size:var(--fs-caption); font-weight:var(--fw-medium); color:var(--accent-text);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
  .hero { padding-bottom:var(--sp-5); }
  .hero h1 { font-size:var(--fs-display); font-weight:var(--fw-extra); letter-spacing:-.03em; line-height:1.08; margin:0 0 var(--sp-4); color:var(--text); }
  .hero .lead { font-size:1.125rem; color:var(--text-muted); margin:0; max-width:72ch; overflow-wrap:break-word; }

  /* Layout: fila hero de ancho completo + sidebar de TOC (izquierda, sticky) y columna de contenido. */
  .layout { display:flex; align-items:flex-start; gap:var(--sp-7); margin-top:0; padding-top:var(--sp-6); border-top:1px solid var(--border); }
  .sidebar { flex:0 0 260px; width:260px; position:sticky; top:calc(var(--topbar-h,64px) + 20px); max-height:calc(100vh - 104px); overflow-y:auto;
    border-right:1px solid var(--border); padding-right:var(--sp-5); }
  .sidebar #toc-links { display:flex; flex-direction:column; gap:2px; }
  .sidebar #toc-links a { display:block; padding:5px 0 5px 10px; border-left:2px solid transparent; font-size:var(--fs-sm); color:var(--text-muted); text-decoration:none;
    white-space:normal; transition:color var(--ease),border-color var(--ease); }
  .sidebar #toc-links a.l3 { padding-left:24px; font-size:var(--fs-caption); }
  .sidebar #toc-links a:hover { color:var(--accent-text); text-decoration:none; }
  .sidebar #toc-links a.active { color:var(--accent-text); font-weight:var(--fw-medium); border-left-color:var(--accent); }
  .content-wrap { flex:1 1 auto; min-width:0; max-width:900px; }

  @media (max-width:900px) {
    .layout { flex-direction:column; gap:var(--sp-4); }
    .sidebar { position:static; width:100%; flex:0 0 auto; max-height:none; overflow:visible;
      border-right:none; padding-right:0; border-bottom:1px solid var(--border); padding-bottom:var(--sp-4); }
    .content-wrap { max-width:100%; }
  }

  h2 { font-size:var(--fs-h2); font-weight:var(--fw-bold); color:var(--text); letter-spacing:-.02em; margin-top:var(--sp-8); border-bottom:1px solid var(--border); padding-bottom:var(--sp-2); }
  h3 { font-size:var(--fs-h3); font-weight:var(--fw-bold); color:var(--text); letter-spacing:-.015em; margin-top:var(--sp-7); }
  /* overflow-wrap tambien en la prosa: secuencias unidas por barra sin espacios
     (consolidation/namespacing/renaming/splitting) son una sola palabra sin
     punto de corte y se salian de la caja en movil. Solo parte si desborda. */
  #contenido p, #contenido li { max-width:58ch; overflow-wrap:break-word; }
  a { color:var(--accent-text); text-decoration:none; font-weight:var(--fw-medium); }
  a:hover { text-decoration:underline; }
  strong { font-weight:var(--fw-semibold); }

  /* overflow-wrap: los tokens de code inline unidos por barra sin espacios
     (errorCategory/isRetryable/suggestedAction) forman una secuencia sin punto
     de corte que desbordaba el ancho en movil. */
  code { font-family:var(--font-mono); font-size:var(--fs-code); background:var(--surface-2); color:var(--text); border:1px solid var(--border); padding:1px 6px; border-radius:var(--r-sm); overflow-wrap:anywhere; }
  pre { background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:var(--r-md); padding:16px 18px; overflow-x:auto; font-family:var(--font-mono); font-size:var(--fs-code); line-height:1.6; margin:var(--sp-4) 0; }
  pre code { background:none; border:none; color:inherit; padding:0; }
  pre.mermaid { background:var(--surface); color:var(--text); border:1px solid var(--border); text-align:center; }
  /* Etiqueta de lenguaje en bloques de código (data-lang en el pre). */
  pre[data-lang] { position:relative; padding-top:30px; }
  pre[data-lang]::before { content:attr(data-lang); position:absolute; top:8px; right:12px; font-size:var(--fs-caption); color:var(--text-muted); letter-spacing:.05em; }
  /* Referencias oficiales al cierre de cada lección. */
  .doc-link { border:1px solid var(--border); border-radius:var(--r-md); padding:10px 14px; font-size:var(--fs-sm); color:var(--text-muted); background:var(--surface); }
  /* Foco visible (regla de accesibilidad Volt). */
  :is(a, button, input, select):focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  table { border-collapse:collapse; width:100%; font-size:var(--fs-sm); }
  .table-wrap { overflow-x:auto; margin:1.2em 0; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); }
  thead th { font-size:var(--fs-caption); text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); }
  tbody tr:hover { background:var(--surface-2); }

  blockquote { border-left:3px solid var(--accent); margin:1.2em 0; padding:8px 18px; color:var(--text-muted); }
  blockquote p { margin:.4em 0; }
  hr { border:none; border-top:1px solid var(--border); margin:var(--sp-6) 0; }

  .minicheck { border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-left:3px solid var(--accent); border-radius:var(--r-lg); padding:var(--sp-5); margin:var(--sp-4) 0; background:var(--accent-weak); }
  .minicheck .mc-q { margin-top:0; }
  .minicheck label { display:block; padding:5px 0; cursor:pointer; }
  .minicheck input[type="radio"], .minicheck input[type="checkbox"] { accent-color:var(--accent); }
  .minicheck button, .mc-check { font:inherit; font-size:var(--fs-caption); font-weight:var(--fw-semibold); border:1px solid transparent; background:var(--accent-btn); color:var(--accent-contrast); border-radius:var(--r-md); padding:6px 12px; margin-top:10px; cursor:pointer; transition:background var(--ease); }
  .minicheck button:hover, .mc-check:hover { background:var(--accent-btn-hover); }
  .mc-feedback { display:none; margin-top:12px; padding:14px 16px; border-radius:var(--r-md); border:1px solid transparent; font-size:var(--fs-sm); opacity:0; transition:opacity var(--ease); }
  .mc-feedback.ok { display:block; opacity:1; background:var(--success-weak); border-color:color-mix(in srgb, var(--success) 30%, transparent); color:var(--text); }
  .mc-feedback.ko { display:block; opacity:1; background:var(--warning-weak); border-color:color-mix(in srgb, var(--warning) 35%, transparent); color:var(--text); }
  body.print-mode .mc-answer, .mc-answer { font-weight:var(--fw-semibold); color:var(--success); }

  .creditos { max-width:72ch; margin:28px 0 0; padding-top:12px; border-top:1px solid var(--border); color:var(--text-muted); font-size:var(--fs-caption); }
  .print-only { display:none; }
  @media (max-width: 700px) { .wrap { padding:32px 18px 70px; } .hero h1 { font-size:1.75rem; } .topbar { padding:12px 16px; } }
  @media (max-width: 420px) { .brand-name { display:none; } }
  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; }
  }
  @media print {
    .topbar, .sidebar, .minicheck button { display:none !important; }
    .wrap, .layout, main { max-width:100%; padding:0; margin:0; border:none; }
    h2 { break-before:page; }
    h2:first-of-type { break-before:auto; }
    pre { white-space:pre-wrap; }
    a { color:inherit; text-decoration:none; }
    .print-only { display:block; }
  }
  body.print-mode .sidebar, body.print-mode .minicheck button { display:none; }
  .theme-toggle, .fs-toggle { width:40px; padding-left:0; padding-right:0; text-align:center; }
  html[data-lang="typescript"] .lang-variant[data-lang="python"],
  html[data-lang="python"] .lang-variant[data-lang="typescript"] { display:none; }
  .lang-variant > pre { margin-top:0; }
  .lang-variant .lang-note { max-width:72ch; margin:8px 0 0; font-size:var(--fs-caption); line-height:1.45; color:var(--text-muted); border-left:3px solid var(--warning); padding-left:10px; }
  .lang-variant .lang-note code { font-size:.92em; }
  /* El PDF de estudio no tiene JS ni toggle: imprime siempre TypeScript. */
  @media print {
    .lang-variant[data-lang="python"] { display:none !important; }
    .lang-variant[data-lang="typescript"] { display:block !important; }
  }

  /* Secciones del contenido — numeradas con eyebrow (patrón Volt), aire vertical --sp-7. */
  #contenido { counter-reset:sec; }
  #contenido > h2 { counter-increment:sec; margin-top:var(--sp-7); scroll-margin-top:calc(var(--topbar-h,64px) + 20px); }
  #contenido > h2::before { content:counter(sec, decimal-leading-zero) " —"; display:block;
    font-family:var(--font-mono); font-size:var(--fs-caption); font-weight:var(--fw-medium); color:var(--accent-text);
    letter-spacing:.08em; margin-bottom:6px; }

  /* Botón primario (fondo accent): texto casi blanco en ambos temas. */
  .minicheck button, .mc-check { color:var(--on-accent); }

  /* Impreso: sin topbar ni tarjeta; hero sobre blanco con la paleta clara de Volt. */
  @media print {
    .hero { padding-bottom:14px; border-bottom:2px solid #C7D6E4; margin-bottom:20px; }
    .eyebrow { color:#0B69D4; }
    .hero h1 { color:#0E1B2C; }
    .hero .lead { color:#45536C; }
    #contenido > h2::before { color:#0B69D4; }
  }
</style>

// del recurso (guias/quiz/flashcards están a dos niveles del índice, simulacro a
// uno). Se apunta al fichero versionado, presente tanto en recursos/ como en dist/.
(function(){var p=location.pathname.split("/");var i=-1;for(var k=p.length-1;k>=0;k--){if(/^(guias|quiz|flashcards|simulacro)$/.test(p[k])){i=k;break;}}if(i<0)return;var href=new Array(p.length-i).join("../")+"index_v1.0.html";["brand-home","home-link"].forEach(function(id){var a=document.getElementById(id);if(a)a.setAttribute("href",href);});})();

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function () {
  "use strict";
  var printMode = /[?&]print=1/.test(location.search);
  if (printMode) {
    document.body.classList.add("print-mode");
    document.documentElement.dataset.lang = "typescript";
  }

  // La topbar puede ocupar mas de una fila (controles envueltos en movil):
  // medir su altura real evita que .sidebar y los anchors del TOC queden
  // tapados cuando el fallback fijo de una fila no coincide con la real.
  function setTopbarH() {
    var tb = document.querySelector(".topbar");
    if (tb) document.documentElement.style.setProperty("--topbar-h", tb.offsetHeight + "px");
  }
  window.addEventListener("load", setTopbarH);
  window.addEventListener("resize", setTopbarH);

  // Las tablas anchas se envuelven para desplazarse en horizontal en vez de
  // triturar sus celdas: el ancho intrinseco de la tabla se conserva y es el
  // wrapper el que scrollea.
  document.querySelectorAll("#contenido table").forEach(function (t) {
    var wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });

  var darkTheme = document.documentElement.dataset.theme === "dark";
  if (window.mermaid) mermaid.initialize({
    startOnLoad: true, securityLevel: "loose", theme: "base",
    themeVariables: darkTheme ? {
      primaryColor: "#172230", primaryTextColor: "#E4EDF6", primaryBorderColor: "#3FA9FF",
      secondaryColor: "#101927", tertiaryColor: "#33260F", lineColor: "#3FA9FF",
      fontFamily: "Plus Jakarta Sans"
    } : {
      primaryColor: "#E2F1FF", primaryTextColor: "#0E1B2C", primaryBorderColor: "#0E82FF",
      secondaryColor: "#F1F5FA", tertiaryColor: "#FBEFD9", lineColor: "#0E82FF",
      fontFamily: "Plus Jakarta Sans"
    }
  });

  // Build the sidebar TOC from h2/h3 headings.
  var links = document.getElementById("toc-links");
  var heads = document.querySelectorAll("#contenido h2, #contenido h3");
  heads.forEach(function (h, i) {
    if (!h.id) h.id = "sec-" + i;
    var a = document.createElement("a");
    a.href = "#" + h.id;
    // TOC compacto: "Lección N — Título: subtítulo" -> "LN · Título".
    var t = h.textContent;
    var m = t.match(/^Lección\s+(\d+)\s+—\s+(.+)$/);
    if (m) t = "L" + m[1] + " · " + m[2].split(":")[0].trim();
    a.textContent = t;
    a.title = h.textContent;
    if (h.tagName === "H3") a.className = "l3";
    links.appendChild(a);
  });
  var tocAnchors = links.querySelectorAll("a");
  window.addEventListener("scroll", function () {
    var cur = null;
    heads.forEach(function (h) { if (h.getBoundingClientRect().top < 120) cur = h.id; });
    // At the bottom of the page the last headings never cross the 120px line,
    // so highlight the final one instead of the last one that did. Measure the
    // viewport with clientHeight as well: mobile browsers report innerHeight as
    // the *visible* height, shrunk by the retractable URL bar, while the maximum
    // scroll offset is computed against the layout viewport -- comparing with
    // innerHeight alone left the bottom unreachable there by the bar's height.
    var docHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    var viewportH = Math.max(window.innerHeight, document.documentElement.clientHeight);
    if (window.scrollY + viewportH >= docHeight - 24 && heads.length) {
      cur = heads[heads.length - 1].id;
    }
    tocAnchors.forEach(function (a) { a.classList.toggle("active", a.getAttribute("href") === "#" + cur); });
  }, { passive: true });

  // Wire up mini-checks.
  document.querySelectorAll(".minicheck").forEach(function (mc) {
    var correct = (mc.dataset.correct || "").split(",").map(function (s) { return s.trim(); }).sort().join(",");
    var fb = mc.querySelector(".mc-feedback");
    var btn = mc.querySelector(".mc-check");
    if (printMode) { // reveal answers for the PDF export
      mc.querySelectorAll("label").forEach(function (l) {
        var v = l.querySelector("input").value;
        if (correct.split(",").indexOf(v) !== -1) l.classList.add("mc-answer"), l.append(" ✔");
      });
      fb.className = "mc-feedback ok";
      fb.style.opacity = "1";
      fb.textContent = "Respuesta: " + correct + ". " + (fb.dataset.explica || "");
      return;
    }
    if (btn) btn.addEventListener("click", function () {
      var sel = Array.prototype.map.call(mc.querySelectorAll("input:checked"), function (i) { return i.value; }).sort().join(",");
      if (!sel) { fb.className = "mc-feedback ko"; fb.textContent = "Selecciona una opción."; return; }
      var ok = sel === correct;
      fb.className = "mc-feedback " + (ok ? "ok" : "ko");
      fb.textContent = (ok ? "✔ Correcto. " : "✘ No exactamente — la respuesta es " + correct + ". ") + (fb.dataset.explica || "");
    });
  });
})();
</script>
<script>
(function () {
  "use strict";
  var m = location.pathname.match(/bloque-(\d)/);
  if (!m || !window.localStorage) return;
  var PKEY = "ccarf-sum-guia-" + m[1];
  var heads = Array.prototype.slice.call(document.querySelectorAll("#contenido h2"));
  var mcs = document.querySelectorAll(".minicheck");
  var st;
  try { st = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { st = {}; }
  st.bloque = m[1];
  st.visited = st.visited || {};
  st.mc = st.mc || {};
  st.mcTry = st.mcTry || {};   // intento por mini-check: {sel, ok}
  st.totalSections = heads.length;
  st.mcTotal = mcs.length;
  // Funcionalidad "Continuar": st.updated hace de timestamp de "último
  // acceso" a esta guía -- reutiliza el campo ya existente (antes solo se
  // actualizaba al detectar scroll/mini-check) forzando un guardado aquí, en
  // cada carga de página, aunque no cambie nada más. El índice del curso
  // (plantillas/index.template.html) compara este mismo campo con el de
  // "ccarf-sum-quiz-<bloque>.updated" para decidir a qué recurso apunta el
  // botón global "Continuar".
  save();
  function save() {
    st.nVisited = Object.keys(st.visited).length;
    st.mcDone = Object.keys(st.mc).length;
    st.mcTried = Object.keys(st.mcTry).length;
    st.updated = Date.now();
    try { localStorage.setItem(PKEY, JSON.stringify(st)); } catch (e) {}
  }
  var t = null;
  var contenido = document.getElementById("contenido");
  // Visible height: visualViewport tracks the area the reader actually sees
  // (mobile browsers shrink it by the retractable URL bar); innerHeight is
  // the fallback.
  function viewportH() {
    return (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  }
  // Bottom detection is geometric, not arithmetic: the end of #contenido is on
  // screen. The previous rule compared scrollY + viewport height against the
  // document height, and on tablets those three numbers disagree with each
  // other (layout vs visual viewport, rubber-band clamping of scrollY), so the
  // bottom was never detected and the last section stayed unread (90% cap).
  // The legacy comparison is kept as a second chance, never as the only path.
  function atBottom() {
    var vh = viewportH();
    if (contenido && contenido.getBoundingClientRect().bottom <= vh + 24) return true;
    var docHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    var layoutH = Math.max(window.innerHeight, document.documentElement.clientHeight);
    return window.scrollY + layoutH >= docHeight - 24;
  }
  // A section counts as read once its heading has scrolled above the middle of
  // the viewport, and every heading above that line is marked on each sample --
  // marking only the current one loses the sections the reader scrolled past
  // between two samples. At the very bottom the trailing headings can never
  // reach the middle (everything below the fold is already on screen), so they
  // are marked there; otherwise 100% would be unreachable.
  function sample() {
    var bottom = atBottom();
    var middle = viewportH() / 2;
    var was = Object.keys(st.visited).length + "|" + st.lastSection;
    var cur = null;
    heads.forEach(function (h) {
      if (h.getBoundingClientRect().top < middle) { st.visited[h.id] = 1; cur = h; }
      else if (bottom) { st.visited[h.id] = 1; }
    });
    if (bottom && heads.length) cur = heads[heads.length - 1];
    if (cur) { st.lastSection = cur.id; st.lastTitle = cur.textContent; }
    if (Object.keys(st.visited).length + "|" + st.lastSection !== was) save();
  }
  function track() {
    if (t) return;
    t = setTimeout(function () { t = null; sample(); }, 800);
  }
  // Leaving the page (back to the index, tab switch) samples synchronously:
  // a pending throttle timer would otherwise be dropped and the final scroll
  // position -- typically the bottom -- would never be recorded.
  function flush() {
    if (t) { clearTimeout(t); t = null; }
    sample();
  }
  window.addEventListener("scroll", track, { passive: true });
  window.addEventListener("touchend", track, { passive: true });
  window.addEventListener("resize", track);
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flush(); });
  track();
  function nombreDe(mc) {
    var inp = mc.querySelector("input");
    return inp ? inp.name : null;
  }
  function seleccion(mc) {
    return Array.prototype.map.call(mc.querySelectorAll("input:checked"), function (i) { return i.value; }).sort().join(",");
  }

  document.addEventListener("click", function (ev) {
    var btn = ev.target;
    if (!btn.classList || !btn.classList.contains("mc-check")) return;
    var mc = btn.closest(".minicheck");
    setTimeout(function () {
      var fb = mc.querySelector(".mc-feedback");
      var nombre = nombreDe(mc);
      if (!fb || !nombre) return;
      var sel = seleccion(mc);
      if (!sel) return;                       // "selecciona una opcion" no es un intento
      st.mcTry[nombre] = { sel: sel, ok: fb.classList.contains("ok") };
      if (fb.classList.contains("ok")) st.mc[nombre] = 1; else delete st.mc[nombre];
      save();
    }, 50);
  });

  // Al volver a la guia se restaura lo ya respondido: antes se perdia si habias
  // acertado o fallado, y cada visita empezaba de cero.
  if (!/[?&]print=1/.test(location.search)) {
    mcs.forEach(function (mc) {
      var nombre = nombreDe(mc);
      var prev = nombre && st.mcTry[nombre];
      if (!prev || !prev.sel) return;
      var sel = prev.sel.split(",");
      Array.prototype.forEach.call(mc.querySelectorAll("input"), function (i) {
        if (sel.indexOf(i.value) !== -1) i.checked = true;
      });
      var btn = mc.querySelector(".mc-check");
      if (btn) btn.click();                   // reutiliza el mismo render de feedback
    });
  }

  // ?continue=1 (funcionalidad "Continuar" del índice): salta a la primera
  // sección (h2) aún no marcada como visitada en st.visited, o a la última
  // si ya estaban todas leídas. No se activa en modo impresión (el PDF no
  // tiene JS de scroll con sentido) ni rompe el TOC: se espera a que la
  // página termine de cargar (mermaid renderiza sus SVGs de forma asíncrona
  // y puede desplazar alturas justo después del primer pintado).
  if (/[?&]continue=1/.test(location.search) && !/[?&]print=1/.test(location.search) && heads.length) {
    var contVisitadas = 0;
    for (var cv = 0; cv < heads.length; cv++) { if (st.visited[heads[cv].id]) contVisitadas++; }
    // Sin avance previo (0 secciones visitadas) la guía se abre arriba del todo, sin scroll.
    if (contVisitadas > 0) {
      var contTarget = null;
      for (var ci = 0; ci < heads.length; ci++) {
        if (!st.visited[heads[ci].id]) { contTarget = heads[ci]; break; }
      }
      if (!contTarget) contTarget = heads[heads.length - 1];
      window.addEventListener("load", function () {
        setTimeout(function () {
          try { history.replaceState(null, "", "#" + contTarget.id); } catch (e) {}
          contTarget.scrollIntoView();
        }, 200);
      });
    }
  }
})();
</script>
<script>
(function () {
  "use strict";
  var btn = document.createElement("button");
  btn.className = "theme-toggle"; btn.type = "button";
  function cur() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
  function paint() {
    btn.textContent = cur() === "dark" ? "\u2600" : "\uD83C\uDF19";
    btn.title = cur() === "dark" ? "Cambiar a tema claro" : "Cambiar a tema oscuro";
  }
  btn.addEventListener("click", function () {
    var next = cur() === "dark" ? "light" : "dark";
    if (next === "dark") document.documentElement.dataset.theme = "dark";
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("ccarf-theme", next); } catch (e) {}
    paint();
  });
  paint(); (document.getElementById("topbar-controls") || document.body).appendChild(btn);
})();
</script>
<script>
(function () {
  "use strict";
  // Solo las guias que traen ambas variantes reciben el switch.
  if (!document.querySelector(".lang-variant")) return;
  var NAMES = { python: "Python", typescript: "TypeScript" };
  var btn = document.createElement("button");
  btn.className = "lang-toggle"; btn.type = "button";
  function cur() { return document.documentElement.dataset.lang === "python" ? "python" : "typescript"; }
  function paint() {
    var other = cur() === "python" ? "typescript" : "python";
    btn.textContent = NAMES[cur()];
    btn.title = "Ver los ejemplos de codigo en " + NAMES[other];
  }
  btn.addEventListener("click", function () {
    var next = cur() === "python" ? "typescript" : "python";
    document.documentElement.dataset.lang = next;
    try { localStorage.setItem("ccarf-lang", next); } catch (e) {}
    paint();
  });
  paint(); (document.getElementById("topbar-controls") || document.body).appendChild(btn);
})();
</script>
<script>
(function () {
  "use strict";
  if (!document.documentElement.requestFullscreen) return;
  var btn = document.createElement("button");
  btn.className = "fs-toggle"; btn.type = "button";
  function paint() {
    var fs = !!document.fullscreenElement;
    btn.textContent = fs ? "\u2921" : "\u2922";
    btn.title = fs ? "Salir de pantalla completa" : "Pantalla completa";
  }
  btn.addEventListener("click", function () {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen(); }
  });
  document.addEventListener("fullscreenchange", paint);
  paint(); (document.getElementById("topbar-controls") || document.body).appendChild(btn);
})();
</script>
